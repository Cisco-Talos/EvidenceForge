      - mobile-06
      - mobile-07
      - mobile-08
      - unmanaged-client
    sensors:
    - type: network
      name: sensor-a
      hostname: sensor-a
      monitoring_segments:
      - perimeter
      direction: bidirectional
      placement: tap
      log_formats:
      - zeek_conn
      - zeek_dns
      - zeek_http
      - zeek_ssl
      - zeek_x509
      - zeek_files
    - type: network
      name: sensor-b
      hostname: sensor-b
      monitoring_segments:
      - infrastructure
      - operations
      direction: bidirectional
      placement: tap
      log_formats:
      - zeek_conn
      - zeek_dns
      - zeek_http
      - zeek_ssl
      - zeek_x509
      - zeek_files
    - type: network
      name: sensor-c
      hostname: sensor-c
      monitoring_segments:
      - clients
      direction: bidirectional
      placement: span
      log_formats:
      - zeek_conn
      - zeek_dns
      - zeek_http
      - zeek_ssl
      - zeek_x509
      - zeek_files
      - zeek_dhcp
