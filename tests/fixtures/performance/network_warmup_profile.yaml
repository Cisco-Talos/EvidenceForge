# Anonymized performance fixture. Generated output is not a golden realism dataset.
version: '1.0'
name: network-warmup-performance-profile
description: An anonymized two-hour, network-heavy baseline used only for deterministic performance profiling.
  It preserves a large mixed-role topology and multi-sensor Zeek workload without storyline activity.
environment:
  description: A synthetic multi-segment organization with infrastructure, perimeter services, operations
    systems, and a large client population. Names and identities are intentionally generic because this
    file is a reusable performance fixture.
  timezone:
    default: America/New_York
  service_accounts:
  - svc_archive
  network_identities:
  - id: external-service-a
    hosts:
    - metrics-api.example.net
    ips:
    - 203.0.113.10
    tags:
    - web
    - telemetry
    dns: true
  - id: external-service-b
    hosts:
    - asset-sync.example.org
    ips:
    - 198.51.100.20
    tags:
    - web
    - cloud-storage
    dns: true
  - id: external-service-c
    hosts:
    - relay.example.com
    ips:
    - 192.0.2.30
    tags:
    - web
    dns: true
  network:
    segments:
    - name: perimeter
      cidr: 192.168.101.0/24
      exposure: internal
      description: Synthetic perimeter segment for performance profiling
      systems:
      - perimeter-web-a
      - perimeter-web-b
      - perimeter-web-c
    - name: infrastructure
      cidr: 192.168.1.0/24
      exposure: internal
      description: Synthetic infrastructure segment for performance profiling
      systems:
      - infra-dc-a
      - infra-dc-b
      - infra-dns
      - edge-proxy
      - mail-gateway
      - update-service
      - file-service-a
      - file-service-b
      - internal-portal
      - restricted-files
      - archive-service
    - name: operations
