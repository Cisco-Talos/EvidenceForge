      description: Synthetic operations segment for performance profiling
      systems:
      - directory-console
      - admin-client-a
      - admin-client-b
      - admin-client-c
      - network-console
      - support-client-a
      - support-client-b
      - soc-client-a
      - soc-client-b
      - analysis-client
    - name: clients
