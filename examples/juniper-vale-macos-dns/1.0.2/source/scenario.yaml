  - type: connection
    dst_ip: 198.51.100.88
    dst_port: 443
    hostname: updates.kestrel-tools.example
    service: https
    method: HEAD
    uri: /status
    status_code: 200
    response_body_len: 0
    user_agent: curl/8.23.0
  explanation: An ordinary update check on another assigned Mac uses short HTTPS traffic, with no new
    system job or sustained encoded TXT series.
macos_process_coverage: complete
