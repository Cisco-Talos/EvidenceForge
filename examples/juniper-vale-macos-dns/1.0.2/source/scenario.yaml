storyline:
- id: preexisting-root-foothold
  time: +10m
  actor: root
  system: KR-MAC-01
  activity: An already elevated foothold starts a working shell; initial access and elevation precede
    the collected exercise.
  events:
  - type: process
    process_name: /bin/zsh
    command_line: /bin/zsh
    process_ref: elevated-caller
    supplementary: none
- id: launch-definition
  time: +2h
  actor: root
  system: KR-MAC-01
  activity: The elevated foothold writes a software-updater-style system LaunchDaemon definition.
  events:
  - type: macos_launch_item
    operation: write
    label: com.kestreltools.update-agent
    caller_ref: elevated-caller
    path: /Library/LaunchDaemons/com.kestreltools.update-agent.plist
    program: /opt/homebrew/opt/python@3.14/Frameworks/Python.framework/Versions/3.14/Resources/Python.app/Contents/MacOS/Python
    arguments:
    - /opt/homebrew/opt/python@3.14/Frameworks/Python.framework/Versions/3.14/Resources/Python.app/Contents/MacOS/Python
    - /Library/Application Support/KestrelTools/agent.py
    size_bytes: 1024
    run_at_load: false
    technique: T1543.004
- id: launch-registration
  time: +2h2m
  actor: root
  system: KR-MAC-01
  activity: The system-domain definition is registered separately from its first activation.
  events:
  - type: macos_launch_item
    operation: bootstrap
    label: com.kestreltools.update-agent
    caller_ref: elevated-caller
    path: /Library/LaunchDaemons/com.kestreltools.update-agent.plist
- id: explicit-start
  time: +2h5m
  actor: root
  system: KR-MAC-01
  activity: An explicit activation starts the installed Python interpreter and previously staged script
    through launchd and xpcproxy, without an inferred shell or helper tree.
  events:
  - type: macos_launch_item
    operation: activate
    label: com.kestreltools.update-agent
    caller_ref: elevated-caller
    process_ref: dns-agent
- id: encoded-dns-channel
  time: +2h7m
  actor: root
  system: KR-MAC-01
  activity: The host sends encoded synthetic engineering data in TXT-query labels; collection does not
    establish the originating payload PID.
  events:
  - type: dns_tunnel
    base_domain: telemetry.kr-diagnostics.example
    encoding: base32
    qtype: TXT
    label_length: 30
    payload: KR-ENG|project=FieldKit|release=2026-Q4|review=design-snapshot|classification=synthetic-training
    interval: 23s
    duration: 35m
    jitter: 0.35
    technique: T1071.004
- id: remove-launch-file
  time: +3h
  actor: root
  system: KR-MAC-01
  activity: The plist is removed while the loaded definition remains registered.
  events:
  - type: macos_launch_item
    operation: remove
    label: com.kestreltools.update-agent
    caller_ref: elevated-caller
    path: /Library/LaunchDaemons/com.kestreltools.update-agent.plist
- id: stop-loaded-job
  time: +3h5m
  actor: root
  system: KR-MAC-01
  activity: The loaded job is explicitly unloaded; removal alone did not stop its retained process group.
  events:
  - type: macos_launch_item
    operation: unload
    label: com.kestreltools.update-agent
    caller_ref: elevated-caller
red_herrings:
- id: approved-status-check
  time: +4h
  actor: nadia.shah
  system: KR-MAC-04
  activity: An engineer checks the ordinary software-update endpoint.
  events:
  - type: process
    process_name: /opt/homebrew/opt/curl/bin/curl
    command_line: /opt/homebrew/opt/curl/bin/curl --head https://updates.kestrel-tools.example/status
