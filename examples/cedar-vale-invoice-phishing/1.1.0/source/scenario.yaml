release_notes: Model authored routing with a core router and an edge Cisco ASA firewall
  that publishes the mail server through static NAT. Replace the core SPAN with an
  office-link Zeek TAP and Zeek and Snort TAPs on the core-to-firewall link, and add
  firewall and IDS logs.
