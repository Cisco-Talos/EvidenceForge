version: '1.0'
name: cleanup-resolver-ownership
description: Frozen host-specific resolver health and network evidence control.
environment:
  description: One Windows and one Linux workstation behind network and firewall sensors
  users:
  - username: alice
    full_name: Alice Example
    email: alice@example.test
    primary_system: WIN-01
    enabled: true
  - username: bob
    full_name: Bob Example
    email: bob@example.test
    primary_system: LINUX-01
    enabled: true
  systems:
  - hostname: LINUX-01
    ip: 10.0.0.20
    os: Ubuntu 22.04
    type: server
    services:
    - dns-client
  - hostname: LINUX-02
    ip: 10.0.0.21
    os: Ubuntu 24.04
    type: server
    services:
    - dns-client
  - hostname: WIN-01
    ip: 10.0.0.10
    os: Windows 10
    type: workstation
  network:
    segments:
    - name: workstations
      cidr: 10.0.0.0/24
      exposure: internal
      systems:
      - LINUX-01
      - LINUX-02
      - WIN-01
    sensors:
    - type: network
      name: core-zeek
      monitoring_segments:
      - workstations
      direction: bidirectional
      placement: span
      log_formats:
      - zeek
    - type: ids
      name: core-ids
      monitoring_segments:
      - workstations
      direction: bidirectional
      placement: tap
      log_formats:
      - snort_alert
    - type: firewall
      name: edge-fw
      monitoring_segments:
      - workstations
      direction: bidirectional
      placement: tap
      log_formats:
      - cisco_asa
time_window:
  start: '2024-01-15T10:00:00Z'
  duration: 90m
  warmup: 1h
baseline_activity:
  description: Small mixed-platform baseline
  intensity: low
  variation: low
  traffic_rates:
    web: low
    user_activity: low
    persona_connections: low
storyline: []
output:
  logs:
  - format: windows
  - format: zeek
  - format: ecar
  - format: syslog
  - format: bash_history
  - format: snort_alert
  - format: cisco_asa
  destination: ./output
  compression: false
