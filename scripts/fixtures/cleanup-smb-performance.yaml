version: '1.0'
generation_seed: 42
name: cleanup-smb-performance
description: Minimal test scenario with 1 user, 1 system, 1 hour
environment:
  description: Minimal test environment
  timezone:
    default: UTC
  users:
  - username: test_user
    full_name: Test User
    email: test.user@example.com
    groups: []
    enabled: true
    primary_system: SMBCLIENT-09
  systems:
  - hostname: SMBCLIENT-09
    ip: 10.0.0.1
    os: Windows 10
    type: workstation
    services: []
    roles: []
    public_hostnames: []
  - hostname: FS-01
    ip: 10.0.0.20
    os: Windows Server 2022
    type: server
    services: []
    roles: []
    public_hostnames: []
  network_identities: []
  service_accounts: []
  stale_accounts: []
  groups: []
  network:
    segments:
    - name: workstations
      cidr: 10.0.0.0/24
      description: ''
      systems:
      - SMBCLIENT-09
      - FS-01
      exposure: internal
    sensors:
    - type: network
      name: core-zeek
      hostname: ''
      monitoring_segments:
      - workstations
      direction: bidirectional
      placement: span
      capture_profile: ''
      log_formats:
      - zeek
      interfaces: {}
      interface_security_levels: {}
      policy: []
      default_action: deny
      deny_ratio: 5.0
      drop_mode: drop
      threat_detection_rate: 10
      nat_rules: []
      description: ''
    - type: firewall
      name: edge-fw
      hostname: ''
      monitoring_segments:
      - workstations
      direction: bidirectional
      placement: tap
      capture_profile: ''
      log_formats:
      - cisco_asa
      interfaces: {}
      interface_security_levels: {}
      policy: []
      default_action: deny
      deny_ratio: 5.0
      drop_mode: drop
      threat_detection_rate: 10
      nat_rules: []
      description: ''
    public_cidrs: []
  storage:
    population: small
    activity: normal
    file_sets: []
    servers:
    - system: FS-01
      presets: []
      audit: standard
      volumes:
      - id: data
        mount: D:\
        filesystem: ntfs
      shares:
      - id: finance
        name: Finance
        volume: data
        root: Departments\Finance
        preset: department
        encryption: not_required
        access:
          read:
          - test_user
          modify:
          - test_user
          admin: []
          deny: []
        seed_files:
        - ref: forecast-00
          path: Reports\FY26\forecast-00.xlsx
          size_bytes: 4096
          tags:
          - finance
        - ref: forecast-01
          path: Reports\FY26\forecast-01.xlsx
          size_bytes: 4097
          tags:
          - finance
        - ref: forecast-02
          path: Reports\FY26\forecast-02.xlsx
          size_bytes: 4098
          tags:
          - finance
      share_overrides: []
    mappings: []
  proxy:
    mode: transparent
    listener_port: 8080
    auth_policy:
      mode: realistic
      allowlisted_domain_classes:
      - windows_update
      - windows_trust_list
      - software_update
      - telemetry
      - crl
      - ocsp
      non_human_principals: false
      machine_account_probability: 0.0
      service_account_probability: 0.0
  identity:
    windows_default_scope: auto
    linux_default_scope: directory
    windows_account_control: {}
    users: {}
  deployment_overrides: []
  observation_overrides: []
personas: []
time_window:
  start: '2024-01-15T10:00:00Z'
  duration: 20m
  warmup: 8h
baseline_activity:
  description: Minimal baseline activity
  intensity: low
  variation: low
  suspicious_noise: high
  traffic_rates:
    smb_interval: 50000
  traffic_affinities: []
  traffic_suppression: []
observation_profile: complete
storyline:
- id: read-forecast
  time: +10m
  actor: test_user
  system: SMBCLIENT-09
  activity: Read a forecast from Finance
  events:
  - ids_alerts: []
    type: smb_activity
    operation: read
    purpose: auto
    target:
      type: share
      share: FS-01.finance
    batch:
      count: 3
      duration: 8m
    outcome: success
    path_style: auto
    client_access: auto
    auth_protocol: auto
red_herrings: []
output:
  logs:
  - format: windows
  - format: zeek
  - format: ecar
  destination: ./output
  compression: false
logon_grace_period: 30m
