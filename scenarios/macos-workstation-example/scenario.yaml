# Compatible Scenario 1.0 input exercising the experimental Mac foundation.
# All identities are invented. No local workstation inventory is used.
version: "1.0"
name: macos-workstation-example
description: "Experimental macOS 26 arm64 baseline with correlated eCAR, network and interactive zsh history"
environment:
  description: "One invented development workstation on an observed network"
  domain: example.test
  users:
    - username: alex
      full_name: Alex Example
      email: alex@example.test
      persona: developer
      primary_system: MAC-01
  systems:
    - hostname: MAC-01
      ip: 192.0.2.10
      os: macOS 26
      os_build: 25A354
      architecture: arm64
      type: workstation
      assigned_user: alex
  network:
    segments:
      - name: workstations
        cidr: 192.0.2.0/24
        exposure: internal
        systems: [MAC-01]
    sensors:
      - name: core-zeek
        type: network
        monitoring_segments: [workstations]
        direction: bidirectional
        placement: span
        log_formats: [zeek]
time_window:
  start: "2026-10-19T14:00:00Z"
  duration: 3h
  warmup: 1h
baseline_activity:
  description: "Low-volume developer activity; no attack storyline"
  intensity: low
  variation: low
output:
  logs:
    - format: ecar
    - format: zeek
    - format: zsh_history
    - format: bash_history
  destination: ./output
  compression: false
