# All identities are independently invented. Native coverage is experimental and bounded.
version: '1.0'
name: macos-native-workspace-example
description: Experimental loginwindow workspace-entry export with correlated eCAR
  and network evidence; method entry does not prove desktop completion.
environment:
  description: One invented development workstation on an observed network
  domain: example.test
  users:
  - username: alex
    full_name: Alex Example
    email: alex@example.test
    persona: developer
    primary_system: MAC-01
  systems:
  - hostname: MAC-01
    ip: 192.0.2.10
    os: macOS 26
    os_build: 25A354
    architecture: arm64
    type: workstation
    assigned_user: alex
  network:
    segments:
    - name: workstations
      cidr: 192.0.2.0/24
      exposure: internal
      systems:
      - MAC-01
    sensors:
    - name: core-zeek
      type: network
      monitoring_segments:
      - workstations
      direction: bidirectional
      placement: span
      log_formats:
      - zeek
time_window:
  start: '2026-10-19T14:00:00Z'
  duration: 3h
  warmup: 1h
baseline_activity:
  description: Low-volume developer activity; no attack storyline
  intensity: low
  variation: low
output:
  logs:
  - format: ecar
  - format: zeek
  - format: zsh_history
  - format: bash_history
  - format: macos_unified_log
  destination: ./output
  compression: false
storyline:
- id: workspace-login
  time: +1m
  actor: alex
  system: MAC-01
  activity: Request a local interactive workspace; native method-entry observation
    only
  events:
  - type: logon
    logon_type: 2
