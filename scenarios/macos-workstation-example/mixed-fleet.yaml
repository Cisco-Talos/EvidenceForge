# Compatible Scenario 1.0 example; all identities are invented.
version: '1.0'
name: macos-mixed-fleet-example
description: Experimental mixed-fleet isolation example with invented Mac, Windows and Linux workstations
environment:
  description: Three independent invented users; no remote-access or persistence claims
  domain: example.test
  users:
  - username: alex
    full_name: Alex Example
    email: alex@example.test
    persona: developer
    primary_system: MAC-01
  - username: robin
    full_name: Robin Example
    email: robin@example.test
    persona: developer
    primary_system: WIN-01
  - username: sam
    full_name: Sam Example
    email: sam@example.test
    persona: developer
    primary_system: LINUX-01
  systems:
  - hostname: MAC-01
    ip: 192.0.2.10
    os: macOS 27
    os_build: modeled-macos27-arm64
    architecture: arm64
    type: workstation
    assigned_user: alex
  - hostname: WIN-01
    ip: 192.0.2.20
    os: Windows 11
    architecture: x64
    type: workstation
    assigned_user: robin
  - hostname: LINUX-01
    ip: 192.0.2.30
    os: Ubuntu 24.04
    architecture: x64
    type: workstation
    assigned_user: sam
  network:
    segments:
    - name: workstations
      cidr: 192.0.2.0/24
      exposure: internal
      systems:
      - MAC-01
      - WIN-01
      - LINUX-01
    sensors:
    - name: core-zeek
      type: network
      monitoring_segments:
      - workstations
      direction: bidirectional
      placement: span
      log_formats:
      - zeek
time_window:
  start: '2026-10-19T14:00:00Z'
  duration: 3h
  warmup: 1h
baseline_activity:
  description: Low-volume developer activity; no attack storyline
  intensity: low
  variation: low
output:
  logs:
  - format: ecar
  - format: zeek
  - format: zsh_history
  - format: bash_history
  - format: windows
  - format: syslog
  destination: ./output
  compression: false
