# Fixed acceptance scope. All identities and artifacts are invented.
name: macos-workstation-acceptance
description: Fixed thirty-minute two-Mac native process acceptance workload
status: draft
draft_id: 299894d8-447b-4ba2-a366-3c975365fcb2
publisher: davidjbianco
parents: []
schema_version: '3.0'
environment:
  description: 'Invented development lab: one developer, two Macs, no industry or
    organization packs. No local inventory.'
  domain: example.test
  users:
  - username: alex
    full_name: Alex Example
    email: alex@example.test
    persona: developer
    primary_system: MAC-APPLE
  systems:
  - hostname: MAC-APPLE
    ip: 192.0.2.10
    os: macOS 27
    os_build: modeled-macos27-arm64
    architecture: arm64
    type: workstation
    assigned_user: alex
    services:
    - ssh
  - hostname: MAC-ITERM
    ip: 192.0.2.20
    os: macOS 27
    os_build: modeled-macos27-arm64
    architecture: arm64
    type: workstation
    assigned_user: alex
    services:
    - ssh
  network:
    segments:
    - name: workstations
      cidr: 192.0.2.0/24
      exposure: internal
      systems:
      - MAC-APPLE
      - MAC-ITERM
    sensors:
    - name: core-zeek
      type: network
      monitoring_segments:
      - workstations
      direction: bidirectional
      placement: span
      log_formats:
      - zeek
  network_identities:
  - id: development-portal
    hosts:
    - portal.example.test
    ips:
    - 203.0.113.80
    tags:
    - web
  deployment_overrides:
  - system: MAC-APPLE
    user_applications:
    - user: alex
      applications:
      - macos-terminal
      - chrome
  - system: MAC-ITERM
    user_applications:
    - user: alex
      applications:
      - macos-iterm2
time_window:
  start: '2026-10-19T14:00:00Z'
  duration: 30m
  warmup: 1h
baseline_activity:
  description: Ordinary medium-intensity developer activity, including installed applications
    and their helpers; no process-family suppression.
  intensity: medium
  variation: medium
  suspicious_noise: low
output:
  logs:
  - format: ecar
  - format: macos_endpoint_security
  - format: macos_unified_log
  - format: zeek
  - format: zsh_history
  destination: ./output
  compression: false
generation_seed: 373
observation_profile: complete
macos_process_coverage: complete
storyline:
- id: setup-provisioner
  time: '2026-10-19T13:40:00Z'
  actor: root
  system: MAC-APPLE
  activity: Explicit pre-existing fixture control; its startup is outside the acceptance
    window
  events:
  - type: process
    process_name: /usr/local/libexec/lab-provisioner
    command_line: /usr/local/libexec/lab-provisioner
    supplementary: none
    process_ref: preexisting-provisioner
- id: setup-job-file
  time: '2026-10-19T13:41:00Z'
  actor: root
  system: MAC-APPLE
  activity: Install the OS inventory job before collection
  events:
  - type: macos_launch_item
    label: org.example.os-inventory
    caller_ref: preexisting-provisioner
    operation: write
    path: /Library/LaunchDaemons/org.example.os-inventory.plist
    program: /usr/bin/sw_vers
    arguments:
    - /usr/bin/sw_vers
    size_bytes: 512
    launch_profile: root_xpcproxy_v11
- id: setup-job-registration
  time: '2026-10-19T13:42:00Z'
  actor: root
  system: MAC-APPLE
  activity: Register, without starting, the inventory job before collection
