time_window:
  start: "2024-03-18T12:00:00Z"
  duration: "6h"
  warmup: "2h"

logon_grace_period: "30m"
observation_profile: enterprise_standard

baseline_activity:
  description: "Low-volume but varied healthcare IT baseline activity"
  intensity: low
  variation: medium
  suspicious_noise: medium

red_herrings:
  - id: rh-001
    time: "+1h05m"
    actor: sophia.martinez
    system: WS-SMARTINEZ-01
    activity: "Sales user mistypes password several times before a normal logon"
    explanation: "Sophia had recently changed her password and mistyped it before succeeding; this mimics a lockout-pattern alert without attacker involvement."
    events:
      - type: failed_logon
        logon_type: 2
        source_ip: "10.10.1.36"
        target_username: sophia.martinez
        technique: "Benign - User Error"
        description: "First mistyped password"
      - type: failed_logon
        logon_type: 2
        source_ip: "10.10.1.36"
        target_username: sophia.martinez
        technique: "Benign - User Error"
        description: "Second mistyped password"
      - type: failed_logon
        logon_type: 2
        source_ip: "10.10.1.36"
        target_username: sophia.martinez
        technique: "Benign - User Error"
        description: "Third mistyped password"
      - type: logon
        logon_type: 2
        source_ip: "10.10.1.36"
        technique: "Benign - User Error"
        description: "Successful local logon after typos"

  - id: rh-003
    time: "+2h05m"
    actor: lina.nguyen
    system: WS-LNGUYEN-01
    activity: "Developer refreshes Ubuntu package metadata from the public archive"
    explanation: "Routine package maintenance uses the APT HTTP user agent and triggers a low-priority policy alert."
    events:
      - type: connection
        dst_ip: "91.189.91.82"
        dst_port: 80
        hostname: "archive.ubuntu.com"
        service: http
        method: GET
        uri: "/ubuntu/dists/jammy/InRelease"
        status_code: 200
        user_agent: "Debian APT-HTTP/1.3 (2.4.10)"
        orig_bytes: 734
        resp_bytes: 270118
        ids_alerts:
          - sid: 2013504
            policy: every
        technique: "Benign - Package Maintenance"
        description: "Expected APT metadata retrieval that produces a policy false positive"

  - id: rh-004
    time: "+3h32m"
    actor: lina.nguyen
    system: WS-LNGUYEN-01
    activity: "Developer uploads EHR connector diagnostics to a vendor support case"
    explanation: "Lina attached a routine diagnostics bundle to an existing vendor support case while troubleshooting an integration issue."
    event_spacing:
      mode: automated
      min_delay: "2s"
      max_delay: "5s"
    events:
      - type: process
        process_name: "/usr/bin/tar"
        command_line: >-
          /usr/bin/tar -czf /tmp/mhs-support-48217.tar.gz
          /var/log/ehr-connector/connector.log /var/log/ehr-connector/queue.log
        technique: "Benign - Vendor Support"
        description: "Create a compressed diagnostics bundle for the support case"
      - type: process
        process_name: "/usr/bin/curl"
        command_line: >-
          /usr/bin/curl --fail --silent --show-error
          --proxy http://proxy.meridianhcs.com:8080
          --form 'metadata={"ticket":"MHS-48217","component":"ehr-connector"};type=application/json'
          --form 'diagnostics=@/tmp/mhs-support-48217.tar.gz;type=application/gzip'
          http://support.valeworks-health.net/api/v1/cases/MHS-48217/attachments
        technique: "Benign - Vendor Support"
        description: "Upload ticket metadata and the diagnostics archive to vendor support"
      - type: connection
        dst_ip: "52.44.186.73"
        dst_port: 80
        hostname: "support.valeworks-health.net"
        service: http
        method: POST
        uri: "/api/v1/cases/MHS-48217/attachments"
        status_code: 200
        user_agent: "curl/7.81.0"
        request_multipart:
          media_type: multipart/form-data
          parts:
            - name: metadata
              value: '{"ticket":"MHS-48217","component":"ehr-connector"}'
              content_type: application/json
              detected_mime_type: application/json
            - name: diagnostics
              body_len: 1572864
              local_source_path: /tmp/mhs-support-48217.tar.gz
              filename: mhs-support-48217.tar.gz
              content_type: application/gzip
              detected_mime_type: application/gzip
        response_body_len: 96
        technique: "Benign - Vendor Support"
        description: "Vendor support accepts the multipart diagnostics upload"

  - id: rh-005
    time: "+4h05m"
    actor: diego.ramirez
    system: WS-DRAMIREZ-01
    activity: "Finance user completes a routine month-end document work burst on the mapped share"
    explanation: "Diego reviews, edits, creates, and publishes ordinary Finance documents through his persistent F: mapping."
    event_spacing:
      mode: explicit_offsets
      offsets: ["0s", "20s", "1m", "2m", "3m"]
    events:
      - type: smb_activity
        operation: browse
        purpose: interactive
        target:
          type: share
          share: FILE-SRV-01.finance
          file_ref: q1_forecast
        outcome: success
        path_style: mapped
        mapping: finance-f
        technique: "Benign - Finance Operations"
        description: "Browse the quarter-end working set through F:"
      - type: smb_activity
        operation: read
        purpose: interactive
        target:
          type: share
          share: FILE-SRV-01.finance
          file_ref: q1_budget
        outcome: success
        path_style: mapped
        mapping: finance-f
        technique: "Benign - Finance Operations"
        description: "Open the current quarter budget workbook"
      - type: smb_activity
        operation: update
        purpose: interactive
        target:
          type: share
          share: FILE-SRV-01.finance
          file_ref: q1_variance
        outcome: success
        path_style: mapped
        mapping: finance-f
        technique: "Benign - Finance Operations"
        description: "Save updated variance calculations"
      - type: smb_activity
        operation: create
        purpose: interactive
        target:
          type: share
          share: FILE-SRV-01.finance
          path: 'Q1\FY24\Working\close-checklist.txt'
        outcome: success
        path_style: mapped
        mapping: finance-f
        technique: "Benign - Finance Operations"
        description: "Create a close checklist on the Finance share"
      - type: smb_activity
        operation: move
        purpose: interactive
        source:
          type: share
          share: FILE-SRV-01.finance
          file_ref: variance_draft
        destination:
          type: share
          share: FILE-SRV-01.finance
          path: 'Q1\FY24\Published\variance-notes.docx'
        outcome: success
        path_style: mapped
        mapping: finance-f
        technique: "Benign - Finance Operations"
        description: "Publish a draft by moving it within the same share"

  - id: rh-006
    time: "+4h40m"
    actor: marcus.chen
    system: WS-MCHEN-01
