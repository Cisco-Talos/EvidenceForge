      - type: network
        name: zeek-dmz
        placement: span
        monitoring_segments: [dmz]
        direction: bidirectional
        log_formats: [zeek]
      - type: ids
        name: snort-perimeter
        placement: tap
        monitoring_segments: [dmz]
        direction: bidirectional
        log_formats: [snort_alert]
      - type: ids
        name: snort-core
        placement: span
        monitoring_segments: [corporate_lan, server_vlan]
        direction: bidirectional
        log_formats: [snort_alert]
      - type: firewall
        name: fw-perimeter
        placement: tap
        monitoring_segments: [corporate_lan, server_vlan, dmz]
        direction: bidirectional
        log_formats: [cisco_asa]
        interfaces:
          corporate_lan: inside
          server_vlan: inside
          dmz: dmz
        default_action: deny
        deny_ratio: 2.0
        drop_mode: drop
        threat_detection_rate: 10
        nat_rules:
          - type: dynamic_pat
            src: [corporate_lan, server_vlan, dmz]
            mapped_ip: "203.14.220.1"
          - type: static
            src: dmz
            real_ip: "10.10.3.10"
            mapped_ip: "203.14.220.10"
          - type: static
            src: server_vlan
            real_ip: "10.10.2.25"
            mapped_ip: "203.14.220.11"
        policy:
          - {src: external, dst: dmz, ports: [80, 443]}
          - {src: external, dst: server_vlan, ports: [25]}
          - {src: corporate_lan, dst: any, ports: []}
          - {src: server_vlan, dst: external, ports: [25, 53, 80, 443]}
          - {src: server_vlan, dst: server_vlan, ports: []}
          - {src: dmz, dst: server_vlan, ports: [3306]}

