name: macos27-native-assessment
macos_process_coverage: partial
description: 'Six-hour fictional software-consultancy benchmark for macOS 27 arm64: qualified v11 process
  phases, explicit policy refusal, shell history and mixed endpoint/network evidence. Native coverage
  limits remain explicit.'
status: draft
draft_id: 37cc86e1-c4a1-47bb-aaf2-5885a6b9b129
publisher: davidjbianco
parents:
- kind: scenario
  publisher: davidjbianco
  name: macos-assessment
  draft_id: 9066de90-8a34-4cb9-a70c-645254ff53ed
  digest: f2fae1af140fcec6a166b5acb77e2da8ee777600132b4b3233f1930ba54035d0
display_name: Northstar Software - macOS 27 Native Coverage
schema_version: '3.0'
composition: {}
environment:
  description: Northstar Software is a small software consultancy. Maya Chen and Owen Patel develop on
    Apple Silicon Macs; Nora Ellis handles operations on Windows. A Linux build and Samba server supports
    the observed office LAN. The model is scenario-local and uses no reusable packs.
  timezone:
    default: America/New_York
  users:
  - username: maya.chen
    full_name: Maya Chen
    email: maya.chen@northstar.example
    persona: developer
    primary_system: NS-MAC-01
    groups:
    - Engineering
  - username: owen.patel
    full_name: Owen Patel
    email: owen.patel@northstar.example
    persona: developer
    primary_system: NS-MAC-02
    groups:
    - Engineering
  - username: nora.ellis
    full_name: Nora Ellis
    email: nora.ellis@northstar.example
    persona: sysadmin
    primary_system: NS-WIN-01
    groups:
    - Engineering
  systems:
  - hostname: NS-MAC-01
    ip: 10.42.0.11
    os: macOS 27
    os_build: modeled-macos27-arm64
    architecture: arm64
    type: workstation
    assigned_user: maya.chen
    roles:
    - workstation
    services:
    - smb-client
  - hostname: NS-MAC-02
    ip: 10.42.0.12
    os: macOS 27
    os_build: modeled-macos27-arm64
    architecture: arm64
    type: workstation
    assigned_user: owen.patel
    roles:
    - workstation
    services:
    - ssh
    - smb-client
  - hostname: NS-WIN-01
    ip: 10.42.0.21
    os: Windows 11
    architecture: x64
    type: workstation
    assigned_user: nora.ellis
    roles:
    - workstation
  - hostname: NS-BUILD-01
    ip: 10.42.0.31
    os: Ubuntu 24.04
    architecture: x64
    type: server
    roles:
    - file_server
    - app_server
    services:
    - ssh
    - samba
  groups:
  - name: Engineering
    members:
    - maya.chen
    - owen.patel
    - nora.ellis
  network:
    segments:
    - name: office
      cidr: 10.42.0.0/24
      exposure: internal
      systems:
      - NS-MAC-01
      - NS-MAC-02
      - NS-WIN-01
      - NS-BUILD-01
    sensors:
    - type: network
      name: office-span
      monitoring_segments:
      - office
      direction: bidirectional
      placement: span
      log_formats:
      - zeek
  network_identities:
  - id: release-service
    hosts:
    - releases.northstar.example
    ips:
    - 203.0.113.61
    tags:
    - web
    dns: true
  storage:
    population: small
    activity: normal
    servers:
    - system: NS-BUILD-01
      presets: []
      volumes:
      - id: data
        mount: /srv/samba
        filesystem: ext4
      shares:
      - id: engineering
        name: Engineering
        volume: data
        root: engineering
        preset: department
        population: small
        access:
          read:
          - Engineering
          modify:
          - Engineering
        seed_files:
        - ref: release-notes
          path: Releases\release-notes.txt
          size_bytes: 8192
    mappings:
    - id: engineering
      share: NS-BUILD-01.engineering
      audience:
        systems:
        - NS-MAC-01
        - NS-MAC-02
      credential_mode: per_user
      lifecycle: persistent
time_window:
  start: '2026-10-20T13:00:00Z'
  duration: 6h
  warmup: 1h
baseline_activity:
  description: Ordinary software development, browsing, shared-file work and server administration across
    a small mixed fleet.
  intensity: medium
  variation: high
  suspicious_noise: medium
output:
  logs:
  - format: ecar
  - format: zeek
  - format: windows
  - format: syslog
  - format: bash_history
  - format: zsh_history
  - format: macos_unified_log
  - format: macos_endpoint_security
  destination: ./output
  compression: false
generation_seed: 327
observation_profile: complete
storyline:
- id: maya-login
  time: +2m
  actor: maya.chen
  system: NS-MAC-01
  activity: Maya opens a local desktop session.
  events:
  - type: logon
    logon_type: 2
- id: owen-login
  time: +4m
  actor: owen.patel
  system: NS-MAC-02
  activity: Owen opens a separate local desktop session.
  events:
  - type: logon
    logon_type: 2
- id: local-check
  time: +13m
  actor: maya.chen
  system: NS-MAC-01
  activity: Maya checks the workstation identity.
  events:
  - type: process
    process_name: /usr/bin/id
    command_line: /usr/bin/id
- id: download
  time: +26m
  actor: maya.chen
  system: NS-MAC-01
  activity: Fetch the internal release manifest into Downloads.
  events:
  - type: process
    process_name: /opt/homebrew/opt/curl/bin/curl
    command_line: /opt/homebrew/opt/curl/bin/curl -fsSL https://releases.northstar.example/releases/manifest.json
      -o /Users/maya.chen/Downloads/manifest.json
  - type: connection
    dst_ip: 203.0.113.61
    dst_port: 443
    hostname: releases.northstar.example
    service: ssl
- id: build-login
  time: +48m
  actor: maya.chen
  system: NS-BUILD-01
  activity: Maya connects from her Mac to the Linux build service.
  events:
  - type: ssh_session
    source_ip: 10.42.0.11
- id: build-inspection
  time: +53m
  actor: maya.chen
  system: NS-BUILD-01
  activity: Inspect the build host under the established session.
  events:
  - type: process
    process_name: /usr/bin/uname
    command_line: uname -a
- id: build-logoff
  time: +1h14m
  actor: maya.chen
  system: NS-BUILD-01
  activity: Close the build host session.
  events:
  - type: logoff
- id: release-share
  time: +1h37m
  actor: maya.chen
  system: NS-MAC-01
  activity: Read release notes through the mounted engineering share.
  events:
  - type: smb_activity
    operation: read
    target:
      type: share
      share: NS-BUILD-01.engineering
      file_ref: release-notes
    mapping: engineering
    path_style: mounted
    client_access: auto
    outcome: success
- id: mac-remote-login
  time: +2h8m
  actor: owen.patel
  system: NS-MAC-02
  activity: Owen uses a Windows client to reach his SSH-enabled Mac.
  events:
  - type: ssh_session
    source_ip: 10.42.0.21
- id: remote-check
  time: +2h13m
  actor: owen.patel
  system: NS-MAC-02
  activity: Inspect the remote Mac environment.
  events:
  - type: process
    process_name: /usr/bin/uname
    command_line: /usr/bin/uname -a
- id: remote-nested-shell
  time: +2h15m
  actor: owen.patel
  system: NS-MAC-02
  activity: Inspect the remote workstation through an explicitly retained nested command shell.
  events:
  - type: process
    process_name: /bin/zsh
    command_line: /bin/zsh
    process_ref: owen-nested
- id: remote-nested-id
  time: +2h16m
  actor: owen.patel
  system: NS-MAC-02
  activity: Inspect the remote workstation through an explicitly retained nested command shell.
  events:
  - type: process
    process_name: /usr/bin/id
    command_line: /usr/bin/id
    parent_ref: owen-nested
- id: remote-nested-version
  time: +2h17m
  actor: owen.patel
  system: NS-MAC-02
  activity: Inspect the remote workstation through an explicitly retained nested command shell.
  events:
  - type: process
    process_name: /usr/bin/sw_vers
    command_line: /usr/bin/sw_vers -productVersion
    parent_ref: owen-nested
- id: remote-nested-ps
  time: +2h19m
  actor: owen.patel
  system: NS-MAC-02
  activity: Inspect the remote workstation through an explicitly retained nested command shell.
  events:
  - type: process
    process_name: /bin/ps
    command_line: /bin/ps -axo pid,ppid,command
    parent_ref: owen-nested
- id: remote-nested-query
  time: +2h21m
  actor: owen.patel
  system: NS-MAC-02
  activity: Inspect the remote workstation through an explicitly retained nested command shell.
  events:
  - type: process
    process_name: /usr/bin/uname
    command_line: /usr/bin/uname -a
    parent_ref: owen-nested
- id: mac-remote-logoff
  time: +2h31m
  actor: owen.patel
  system: NS-MAC-02
  activity: Close the remote Mac session.
  events:
  - type: logoff
- id: provisioner
  time: +3h2m
  actor: root
  system: NS-MAC-01
  activity: A privileged modeled maintenance agent stages a system job.
  events:
  - type: process
    process_name: /usr/local/libexec/northstar-maintenance
    process_ref: maintenance
    supplementary: none
