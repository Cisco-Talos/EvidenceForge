name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated prerelease tag to validate, build and publish
        required: true
        type: string
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_EVENT: ${{ github.event_name == 'workflow_dispatch' && 'push' || github.event_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

jobs:
  validate-release-version:
    name: Release version guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      dmg_name: ${{ steps.plan.outputs.dmg_name }}
    steps:
      - name: Checkout release snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install locked runtime dependencies
        run: uv sync --frozen
      - name: Validate release entry and version
        id: plan
        run: >-
          env GITHUB_EVENT_NAME="$RELEASE_EVENT" GITHUB_REF="$RELEASE_REF"
          uv run --no-sync python -m scripts.release_pipeline prepare

  release-ci:
    if: github.event_name != 'pull_request'
    needs: validate-release-version
    uses: ./.github/workflows/ci.yml
    with:
      release-coverage: true
      source-ref: ${{ needs.validate-release-version.outputs.sha }}

  release-slow:
    if: github.event_name != 'pull_request'
    needs: validate-release-version
    uses: ./.github/workflows/release-slow.yml
    with:
      source-ref: ${{ needs.validate-release-version.outputs.sha }}

  build-installers:
    name: Release installer (${{ matrix.platform }})
    if: github.event_name != 'pull_request'
    needs: [validate-release-version, release-ci, release-slow]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            runner: macos-26
    env:
      DMG_NAME: ${{ needs.validate-release-version.outputs.dmg_name }}
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release-version.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Require native Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json
      - name: Install locked dependencies
        run: |
          uv sync --frozen --extra studio --extra dev
          npm --prefix desktop-ui ci
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin --toolchain stable
      - name: Build standalone release DMG
        run: uv run --no-sync python scripts/package_studio_macos.py --build-app --release
      - name: Verify isolated packaged CLI and resources
        run: >-
          uv run --no-sync python scripts/verify_studio_macos.py
          "build/studio-macos/target/aarch64-apple-darwin/release/bundle/macos/EvidenceForge Studio.app"
      - name: Verify DMG and checksum
        run: |
          hdiutil verify "dist/macos/$DMG_NAME"
          env GITHUB_EVENT_NAME="$RELEASE_EVENT" GITHUB_REF="$RELEASE_REF" uv run --no-sync python -m scripts.release_pipeline verify-assets --directory dist/macos
      - name: Upload verified installer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-installer-${{ matrix.platform }}
          path: |
            dist/macos/*.dmg
            dist/macos/*.dmg.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: github.event_name != 'pull_request'
    needs: [validate-release-version, release-ci, release-slow, build-installers]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release-version.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install locked runtime dependencies
        run: uv sync --frozen
      - name: Download this run's verified installers
        run: >-
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          --pattern 'release-installer-*' --dir dist/release
      - name: Publish complete release or resume its draft
        run: >-
          env GITHUB_EVENT_NAME="$RELEASE_EVENT" GITHUB_REF="$RELEASE_REF"
          uv run --no-sync python -m scripts.release_pipeline publish --directory dist/release
