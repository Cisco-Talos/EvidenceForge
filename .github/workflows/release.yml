name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated prerelease tag to validate, build and publish
        required: true
        type: string
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_EVENT: ${{ github.event_name == 'workflow_dispatch' && 'push' || github.event_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

jobs:
  release-scope:
    name: Release scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cleanup: ${{ steps.scope.outputs.cleanup }}
    steps:
      - name: Checkout exact event snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - name: Recognize bounded project-state cleanup
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] || { [ "$EVENT_NAME" = "push" ] && [ "$EVENT_REF" = "refs/heads/main" ]; }; then
            python3 scripts/check_eforge_cleanup.py --base "$BASE_SHA"
          else
            echo "cleanup=false" >> "$GITHUB_OUTPUT"
          fi

  validate-release-version:
    name: Release version guard
    needs: [release-scope]
    if: needs.release-scope.outputs.cleanup != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      dmg_name: ${{ steps.plan.outputs.dmg_name }}
      ci-modern: ${{ steps.ci-policy.outputs.modern }}
    steps:
      - name: Checkout release snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install locked runtime dependencies
        run: uv sync --frozen
      - name: Validate release entry and version
        id: plan
        run: >-
          env GITHUB_EVENT_NAME="$RELEASE_EVENT" GITHUB_REF="$RELEASE_REF"
          uv run --no-sync python -m scripts.release_pipeline prepare
      - name: Detect snapshot CI policy
        id: ci-policy
        run: |
          if [ -f scripts/ci_evidence.py ]; then
            echo "modern=true" >> "$GITHUB_OUTPUT"
          else
            echo "modern=false" >> "$GITHUB_OUTPUT"
          fi

  release-ci:
    if: github.event_name != 'pull_request' && needs.release-scope.outputs.cleanup != 'true' && needs.validate-release-version.outputs.ci-modern == 'true'
    needs: [release-scope, validate-release-version]
    uses: ./.github/workflows/ci.yml
    with:
      release-coverage: true
      source-ref: ${{ needs.validate-release-version.outputs.sha }}

  release-slow:
    if: github.event_name != 'pull_request' && needs.release-scope.outputs.cleanup != 'true' && needs.validate-release-version.outputs.ci-modern == 'true'
    needs: [release-scope, validate-release-version]
    uses: ./.github/workflows/release-slow.yml
    with:
      source-ref: ${{ needs.validate-release-version.outputs.sha }}

  build-installers:
    if: github.event_name != 'pull_request' && needs.release-scope.outputs.cleanup != 'true' && needs.validate-release-version.outputs.ci-modern == 'true'
    needs: [release-scope, validate-release-version]
    uses: ./.github/workflows/installers.yml
    with:
      source-ref: ${{ needs.validate-release-version.outputs.sha }}
      release: true

  # Immutable snapshots such as a5 predate the shard/evidence helpers. Preserve
  # manual recovery using their known CI policy, without overlaying source files.
  release-ci-legacy:
    if: github.event_name != 'pull_request' && needs.release-scope.outputs.cleanup != 'true' && needs.validate-release-version.outputs.ci-modern == 'false'
    needs: [release-scope, validate-release-version]
    uses: Cisco-Talos/EvidenceForge/.github/workflows/ci.yml@4302afd5f38126118ad4346efb7c76b3dac8d06d
    with:
      release-coverage: true
      source-ref: ${{ needs.validate-release-version.outputs.sha }}

  release-slow-legacy:
    if: github.event_name != 'pull_request' && needs.release-scope.outputs.cleanup != 'true' && needs.validate-release-version.outputs.ci-modern == 'false'
    needs: [release-scope, validate-release-version]
    uses: Cisco-Talos/EvidenceForge/.github/workflows/release-slow.yml@4302afd5f38126118ad4346efb7c76b3dac8d06d
    with:
      source-ref: ${{ needs.validate-release-version.outputs.sha }}

  build-installers-legacy:
    if: github.event_name != 'pull_request' && needs.release-scope.outputs.cleanup != 'true' && needs.validate-release-version.outputs.ci-modern == 'false'
    needs: [release-scope, validate-release-version, release-ci-legacy, release-slow-legacy]
    uses: Cisco-Talos/EvidenceForge/.github/workflows/installers.yml@4302afd5f38126118ad4346efb7c76b3dac8d06d
    with:
      source-ref: ${{ needs.validate-release-version.outputs.sha }}
      release: true

  release-gates:
    name: Release publication gates
    if: always() && !cancelled() && github.event_name != 'pull_request' && needs.release-scope.outputs.cleanup != 'true'
    needs: [release-scope, validate-release-version, release-ci, release-slow, build-installers, release-ci-legacy, release-slow-legacy, build-installers-legacy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERSION_RESULT: ${{ needs.validate-release-version.result }}
      MODERN: ${{ needs.validate-release-version.outputs.ci-modern }}
      CI_RESULT: ${{ needs.release-ci.result }}
      SLOW_RESULT: ${{ needs.release-slow.result }}
      INSTALLER_RESULT: ${{ needs.build-installers.result }}
      LEGACY_CI_RESULT: ${{ needs.release-ci-legacy.result }}
      LEGACY_SLOW_RESULT: ${{ needs.release-slow-legacy.result }}
      LEGACY_INSTALLER_RESULT: ${{ needs.build-installers-legacy.result }}
    steps:
      - name: Require every gate for the selected snapshot policy
        run: |
          test "$VERSION_RESULT" = success
          if [ "$MODERN" = true ]; then
            results=("$CI_RESULT" "$SLOW_RESULT" "$INSTALLER_RESULT")
          elif [ "$MODERN" = false ]; then
            results=("$LEGACY_CI_RESULT" "$LEGACY_SLOW_RESULT" "$LEGACY_INSTALLER_RESULT")
          else
            echo "Missing snapshot CI policy"
            exit 1
          fi
          for result in "${results[@]}"; do
            if [ "$result" != success ]; then
              echo "Required release gate finished with result: $result"
              exit 1
            fi
          done

  publish-release:
    name: Publish GitHub Release
    # Ignore skipped ancestors in the unused modern/legacy branch, while still
    # requiring the selected policy's complete validation and installer gates.
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      needs.release-scope.outputs.cleanup != 'true' &&
      needs.validate-release-version.result == 'success' &&
      needs.release-gates.result == 'success'
    needs: [release-scope, validate-release-version, release-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release-version.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install locked runtime dependencies
        run: uv sync --frozen
      - name: Download this run's verified installers
        run: >-
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          --pattern 'release-installer-*' --dir dist/release
      - name: Publish complete release or resume its draft
        run: >-
          env GITHUB_EVENT_NAME="$RELEASE_EVENT" GITHUB_REF="$RELEASE_REF"
          uv run --no-sync python -m scripts.release_pipeline publish --directory dist/release
