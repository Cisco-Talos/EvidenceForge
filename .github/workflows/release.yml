name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated prerelease tag to validate, build and publish
        required: true
        type: string
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_EVENT: ${{ github.event_name == 'workflow_dispatch' && 'push' || github.event_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

jobs:
  release-scope:
    name: Release scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cleanup: ${{ steps.scope.outputs.cleanup }}
    steps:
      - name: Checkout exact event snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - name: Recognize bounded project-state cleanup
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] || { [ "$EVENT_NAME" = "push" ] && [ "$EVENT_REF" = "refs/heads/main" ]; }; then
            python3 scripts/check_eforge_cleanup.py --base "$BASE_SHA"
          else
            echo "cleanup=false" >> "$GITHUB_OUTPUT"
          fi

  validate-release-version:
    name: Release version guard
    needs: [release-scope]
    if: needs.release-scope.outputs.cleanup != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      dmg_name: ${{ steps.plan.outputs.dmg_name }}
    steps:
      - name: Checkout release snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install locked runtime dependencies
        run: uv sync --frozen
      - name: Validate release entry and version
        id: plan
        run: >-
          env GITHUB_EVENT_NAME="$RELEASE_EVENT" GITHUB_REF="$RELEASE_REF"
          uv run --no-sync python -m scripts.release_pipeline prepare

  release-ci:
    if: github.event_name != 'pull_request' && needs.release-scope.outputs.cleanup != 'true'
    needs: [release-scope, validate-release-version]
    uses: ./.github/workflows/ci.yml
    with:
      release-coverage: true
      source-ref: ${{ needs.validate-release-version.outputs.sha }}

  release-slow:
    if: github.event_name != 'pull_request' && needs.release-scope.outputs.cleanup != 'true'
    needs: [release-scope, validate-release-version]
    uses: ./.github/workflows/release-slow.yml
    with:
      source-ref: ${{ needs.validate-release-version.outputs.sha }}

  build-installers:
    if: github.event_name != 'pull_request' && needs.release-scope.outputs.cleanup != 'true'
    needs: [release-scope, validate-release-version, release-ci, release-slow]
    uses: ./.github/workflows/installers.yml
    with:
      source-ref: ${{ needs.validate-release-version.outputs.sha }}
      release: true

  publish-release:
    name: Publish GitHub Release
    if: github.event_name != 'pull_request' && needs.release-scope.outputs.cleanup != 'true'
    needs: [release-scope, validate-release-version, release-ci, release-slow, build-installers]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release-version.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install locked runtime dependencies
        run: uv sync --frozen
      - name: Download this run's verified installers
        run: >-
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          --pattern 'release-installer-*' --dir dist/release
      - name: Publish complete release or resume its draft
        run: >-
          env GITHUB_EVENT_NAME="$RELEASE_EVENT" GITHUB_REF="$RELEASE_REF"
          uv run --no-sync python -m scripts.release_pipeline publish --directory dist/release
