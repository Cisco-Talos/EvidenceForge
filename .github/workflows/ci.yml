name: CI

on:
  workflow_call:
    inputs:
      release-coverage:
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Validate generation behavior declaration
        run: >-
          uv run python scripts/check_generation_behavior.py
          --base-ref "${{ github.event.pull_request.base.sha || (github.ref_type == 'tag' && 'HEAD^') || github.event.before }}"

  tests:
    name: Tests (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeout_minutes: 25
          - os: windows-latest
            timeout_minutes: 45
    timeout-minutes: ${{ matrix.timeout_minutes }}

    steps:
      - name: Preserve repository bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run release coverage gate
        if: inputs.release-coverage && runner.os == 'Linux'
        run: >-
          uv run pytest --ignore-glob='**/test_studio_*.py' --ignore-glob='**/test_desktop_*.py'
          --cov=evidenceforge --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Run tests without coverage
        if: ${{ !inputs.release-coverage || runner.os != 'Linux' }}
        # Studio's native GUI lifecycle is gated separately on its supported macOS host.
        run: uv run pytest --no-cov --ignore-glob='**/test_studio_*.py' --ignore-glob='**/test_desktop_*.py'

  studio:
    name: Studio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json

      - name: Install Studio dependencies
        run: uv sync --extra studio --extra dev

      - name: Install frontend dependencies
        working-directory: desktop-ui
        run: npm ci

      - name: Check shared Studio release version
        run: uv run python scripts/sync_studio_version.py --check

      - name: Test local service and job lifecycle
        run: uv run pytest --no-cov tests/unit/test_studio_*.py tests/unit/test_resource_prediction.py tests/unit/test_desktop_*.py

      - name: Check generated API types
        working-directory: desktop-ui
        run: npm run types:check

      - name: Test frontend interactions
        working-directory: desktop-ui
        run: npm test

      - name: Build frontend
        working-directory: desktop-ui
        run: npm run build

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Test Tauri shell contracts
        working-directory: desktop-ui/src-tauri
        run: cargo +stable test --locked

      - name: Build native Studio window
        working-directory: desktop-ui
        run: npm run tauri -- build --debug --no-bundle

      - name: Build standalone Apple Silicon test app
        run: |
          rustup target add aarch64-apple-darwin --toolchain stable
          uv run python scripts/package_studio_macos.py --build-app --skip-dmg

      - name: Verify isolated packaged CLI and resources
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: >-
          uv run python scripts/verify_studio_macos.py
          "build/studio-macos/target/aarch64-apple-darwin/release/bundle/macos/EvidenceForge Studio.app"

      - name: Archive standalone test app
        run: |
          mkdir -p dist/macos
          ditto -c -k --sequesterRsrc --keepParent "build/studio-macos/target/aarch64-apple-darwin/release/bundle/macos/EvidenceForge Studio.app" "dist/macos/EvidenceForge-Studio-aarch64-test.zip"

      - name: Upload standalone test app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Studio-macOS-Apple-Silicon-test
          path: dist/macos/*
          if-no-files-found: error

  studio-state-recovery:
    name: Studio state recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - name: Preserve frozen fixture bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: uv sync --extra studio --extra dev
      - name: Preservation and fault tests
        run: uv run pytest --no-cov tests/integration/test_studio_state_upgrade.py tests/integration/test_studio_state_edges.py tests/integration/test_studio_state_crashes.py tests/integration/test_studio_state_migrations.py tests/unit/test_studio_state_durability.py tests/unit/test_studio_state_contracts.py
      - name: Native helper lifecycle
        run: uv run pytest --no-cov tests/unit/test_studio_sessions.py tests/integration/test_studio_helper.py tests/unit/test_studio_runtime.py tests/unit/test_studio_ownership.py tests/integration/test_studio_ownership.py
      - name: Extended native crash matrix
        run: uv run pytest -m slow --no-cov tests/integration/test_studio_state_crashes.py tests/integration/test_studio_state_edges.py tests/integration/test_studio_state_migrations.py

  windows-checkpoint-durability:
    name: Windows checkpoint durability
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Preserve repository bytes on Windows
        run: git config --global core.autocrlf false

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Test simulated power-loss recovery
        run: uv run python scripts/check_windows_checkpoint_durability.py

      - name: Upload durability failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-checkpoint-durability-failure
          path: .artifacts/windows-checkpoint-durability/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  ci-required:
    name: Required CI
    runs-on: ubuntu-latest
    needs: [lint, tests, studio, studio-state-recovery, windows-checkpoint-durability]
    if: always()

    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Lint finished with result: ${{ needs.lint.result }}"
            exit 1
          fi

          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "Tests finished with result: ${{ needs.tests.result }}"
            exit 1
          fi

          if [ "${{ needs.studio-state-recovery.result }}" != "success" ]; then
            echo "Studio state recovery gates failed"
            exit 1
          fi
          if [ "${{ needs.studio.result }}" != "success" ]; then
            echo "Studio finished with result: ${{ needs.studio.result }}"
            exit 1
          fi

          if [ "${{ needs.windows-checkpoint-durability.result }}" != "success" ]; then
            echo "Windows checkpoint durability finished with result: ${{ needs.windows-checkpoint-durability.result }}"
            exit 1
          fi
