name: CI
on:
  workflow_dispatch:
    inputs:
      force-tests:
        description: Execute fresh checks instead of reusing matching results
        type: boolean
        default: false
      release-coverage:
        type: boolean
        default: false
        description: Run the combined 70 percent Linux coverage gate
  workflow_call:
    inputs:
      source-ref:
        type: string
        default: ''
      release-coverage:
        type: boolean
        default: false
      force-tests:
        type: boolean
        default: false
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - dev
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  inputs:
    # Temporary: this draft branch iterates through Windows Studio Preview only.
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'dev' && github.head_ref == 'codex/studio-windows-x86_64' && github.event.pull_request.draft) }}
    name: CI input identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.identity.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: uv sync --locked --extra studio --extra dev
      - name: Identify tested inputs
        id: identity
        run: uv run --no-sync python -m scripts.ci_evidence identity
  lint:
    # Temporary: this draft branch iterates through Windows Studio Preview only.
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'dev' && github.head_ref == 'codex/studio-windows-x86_64' && github.event.pull_request.draft) }}
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run ruff check
        run: uv run ruff check .
      - name: Run ruff format check
        run: uv run ruff format --check .
      - name: Validate generation behavior declaration
        run: uv run python scripts/check_generation_behavior.py --base-ref "${{ github.event.pull_request.base.sha || (inputs.source-ref && 'HEAD^') || (github.ref_type == 'tag' && 'HEAD^') || (github.event_name == 'workflow_dispatch'
          && 'HEAD^') || github.event.before }}"
      - name: Check documentation and version metadata
        run: |-
          uv run pytest --no-cov tests/unit/test_external_parser_docs.py
          uv run python scripts/sync_studio_version.py --check
  tests:
    name: Tests (${{ matrix.os }}, Python 3.12, shard ${{ matrix.number }}/8)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            index: 0
            number: 1
          - os: ubuntu-latest
            index: 1
            number: 2
          - os: ubuntu-latest
            index: 2
            number: 3
          - os: ubuntu-latest
            index: 3
            number: 4
          - os: ubuntu-latest
            index: 4
            number: 5
          - os: ubuntu-latest
            index: 5
            number: 6
          - os: ubuntu-latest
            index: 6
            number: 7
          - os: ubuntu-latest
            index: 7
            number: 8
          - os: windows-latest
            index: 0
            number: 1
          - os: windows-latest
            index: 1
            number: 2
          - os: windows-latest
            index: 2
            number: 3
          - os: windows-latest
            index: 3
            number: 4
          - os: windows-latest
            index: 4
            number: 5
          - os: windows-latest
            index: 5
            number: 6
          - os: windows-latest
            index: 6
            number: 7
          - os: windows-latest
            index: 7
            number: 8
      max-parallel: 16
    timeout-minutes: 120
    steps:
      - name: Preserve repository bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
          prune-cache: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Resolve verified prior result
        id: evidence
        run: uv run --no-sync python -m scripts.ci_evidence resolve
      - name: Run routine shard
        if: steps.evidence.outputs.reused != 'true'
        shell: bash
        run: |-
          coverage_flags=(--no-cov)
          if [ "${{ inputs.release-coverage && matrix.os == 'ubuntu-latest' }}" = true ]; then
            coverage_flags=(--cov=evidenceforge --cov-report= --cov-fail-under=0)
          fi
          uv run --no-sync pytest "${coverage_flags[@]}" --durations=20 \
            --ignore-glob='**/test_studio_*.py' --ignore-glob='**/test_desktop_*.py' \
            --ci-tier routine --ci-shard-count 8 --ci-shard-index "${{ matrix.index }}" \
            --ci-report "ci-results/$CI_CHECK_ID/shard.json" \
            --junitxml "ci-timings/$CI_CHECK_ID.xml"
      - name: Record verified execution
        run: uv run --no-sync python -m scripts.ci_evidence record
      - name: Upload CI evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.evidence.outputs.artifact }}
          path: ci-results/${{ env.CI_CHECK_ID }}/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload complete timing report
        if: always() && steps.evidence.outputs.reused != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-timings-${{ env.CI_CHECK_ID }}
          path: ci-timings/*.xml
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
    needs:
      - inputs
    env:
      GH_TOKEN: ${{ github.token }}
      CI_CHECK_ID: routine-${{ matrix.os }}-${{ inputs.release-coverage && matrix.os == 'ubuntu-latest' && 'cov' || 'plain' }}-${{ matrix.index }}
      CI_CHECK_KIND: routine
      CI_JOB_NAME: Tests (${{ matrix.os }}, Python 3.12, shard ${{ matrix.number }}/8)
      CI_RUNNER: ${{ matrix.os }}
      CI_FORCE_RUN: ${{ inputs.force-tests || false }}
      COVERAGE_FILE: ci-results/routine-${{ matrix.os }}-${{ inputs.release-coverage && matrix.os == 'ubuntu-latest' && 'cov' || 'plain' }}-${{ matrix.index }}/coverage.data
    concurrency:
      group: eforge-${{ needs.inputs.outputs.digest }}-routine-${{ matrix.os }}-${{ inputs.release-coverage && matrix.os == 'ubuntu-latest' && 'cov' || 'plain' }}-${{ matrix.index }}
      queue: max
  studio:
    defaults:
      run:
        shell: bash
    name: Studio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
    steps:
      - name: Preserve Windows source bytes
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev bubblewrap \
            apparmor-profiles apparmor-utils
      - name: Load Ubuntu bubblewrap user-namespace profile
        if: runner.os == 'Linux'
        run: |
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          sudo aa-status
      - name: Install Studio dependencies
        run: uv sync --locked --extra studio --extra dev
      - name: Install frontend dependencies
        working-directory: desktop-ui
        run: npm ci
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Resolve verified prior result
        id: evidence
        run: uv run --no-sync python -m scripts.ci_evidence resolve
      - name: Check shared Studio release version
        run: uv run python scripts/sync_studio_version.py --check
        if: steps.evidence.outputs.reused != 'true'
      - name: Test local service and job lifecycle
        run: uv run --no-sync python -m scripts.ci_studio
        if: steps.evidence.outputs.reused != 'true'
      - name: Install Codex for model-free native permission checks
        run: npm install --global @openai/codex@${{ runner.os == 'Windows' && '0.167.0' || '0.162.1' }}
        if: steps.evidence.outputs.reused != 'true'
      - name: Verify native chat sandbox restrictions
        run: uv run --no-sync python scripts/check_studio_sandbox.py
        if: steps.evidence.outputs.reused != 'true'
      - name: Check generated API types
        working-directory: desktop-ui
        run: npm run types:check
        if: steps.evidence.outputs.reused != 'true'
      - name: Test frontend interactions
        working-directory: desktop-ui
        run: npm test
        if: steps.evidence.outputs.reused != 'true'
      - name: Build frontend
        working-directory: desktop-ui
        run: npm run build
        if: steps.evidence.outputs.reused != 'true'
      - name: Test Tauri shell contracts
        working-directory: desktop-ui/src-tauri
        run: cargo +stable test --locked
        if: steps.evidence.outputs.reused != 'true'
      - name: Build native Studio window
        working-directory: desktop-ui
        run: npm run tauri -- build --debug --no-bundle
        if: steps.evidence.outputs.reused != 'true'
      - name: Build standalone Apple Silicon test app
        if: steps.evidence.outputs.reused != 'true' && (runner.os == 'macOS')
        run: |
          rustup target add aarch64-apple-darwin --toolchain stable
          uv run python scripts/package_studio_macos.py --build-app --skip-dmg
      - name: Verify isolated packaged CLI and resources
        if: steps.evidence.outputs.reused != 'true' && (runner.os == 'macOS' && runner.arch == 'ARM64')
        run: uv run python scripts/verify_studio_macos.py "build/studio-macos/target/aarch64-apple-darwin/release/bundle/macos/EvidenceForge Studio.app"
      - name: Archive standalone test app
        if: steps.evidence.outputs.reused != 'true' && (runner.os == 'macOS')
        run: |
          mkdir -p dist/macos
          ditto -c -k --sequesterRsrc --keepParent "build/studio-macos/target/aarch64-apple-darwin/release/bundle/macos/EvidenceForge Studio.app" "dist/macos/EvidenceForge-Studio-aarch64-test.zip"
      - name: Upload standalone test app
        if: steps.evidence.outputs.reused != 'true' && (runner.os == 'macOS')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Studio-macOS-Apple-Silicon-test
          path: dist/macos/*
          if-no-files-found: error
      - name: Record verified execution
        run: uv run --no-sync python -m scripts.ci_evidence record
      - name: Upload CI evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.evidence.outputs.artifact }}
          path: ci-results/${{ env.CI_CHECK_ID }}/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
    needs:
      - inputs
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      CI_CHECK_ID: studio-${{ matrix.os }}
      CI_CHECK_KIND: studio
      CI_JOB_NAME: Studio (${{ matrix.os }})
      CI_RUNNER: ${{ matrix.os }}
      CI_FORCE_RUN: ${{ inputs.force-tests || false }}
    concurrency:
      group: eforge-${{ needs.inputs.outputs.digest }}-studio-${{ matrix.os }}
      queue: max
  studio-state-recovery:
    # Temporary: this draft branch iterates through Windows Studio Preview only.
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'dev' && github.head_ref == 'codex/studio-windows-x86_64' && github.event.pull_request.draft) }}
    name: Studio state recovery (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
    uses: ./.github/workflows/ci-recovery.yml
    with:
      runner: ${{ matrix.os }}
      source-ref: ${{ inputs.source-ref || github.sha }}
      force-tests: ${{ inputs.force-tests || false }}
  windows-checkpoint-durability:
    name: Windows checkpoint durability
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Preserve repository bytes on Windows
        run: git config --global core.autocrlf false
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Resolve verified prior result
        id: evidence
        run: uv run --no-sync python -m scripts.ci_evidence resolve
      - name: Test simulated power-loss recovery
        run: uv run python scripts/check_windows_checkpoint_durability.py
        if: steps.evidence.outputs.reused != 'true'
      - name: Upload durability failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-checkpoint-durability-failure
          path: .artifacts/windows-checkpoint-durability/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Record verified execution
        run: uv run --no-sync python -m scripts.ci_evidence record
      - name: Upload CI evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.evidence.outputs.artifact }}
          path: ci-results/${{ env.CI_CHECK_ID }}/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
    needs:
      - inputs
    env:
      GH_TOKEN: ${{ github.token }}
      CI_CHECK_ID: durability-windows-latest
      CI_CHECK_KIND: durability
      CI_JOB_NAME: Windows checkpoint durability
      CI_RUNNER: windows-latest
      CI_FORCE_RUN: ${{ inputs.force-tests || false }}
    concurrency:
      group: eforge-${{ needs.inputs.outputs.digest }}-durability-windows-latest
      queue: max
  ci-required:
    name: Required CI
    runs-on: ubuntu-latest
    needs:
      - lint
      - tests
      - studio
      - studio-state-recovery
      - windows-checkpoint-durability
      - inputs
      - coverage
    if: always() && !(github.event_name == 'pull_request' && github.base_ref == 'dev' && github.head_ref == 'codex/studio-windows-x86_64' && github.event.pull_request.draft)
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Lint finished with result: ${{ needs.lint.result }}"
            exit 1
          fi

          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "Tests finished with result: ${{ needs.tests.result }}"
            exit 1
          fi

          if [ "${{ needs.studio-state-recovery.result }}" != "success" ]; then
            echo "Studio state recovery gates failed"
            exit 1
          fi
          if [ "${{ needs.studio.result }}" != "success" ]; then
            echo "Studio finished with result: ${{ needs.studio.result }}"
            exit 1
          fi

          if [ "${{ needs.windows-checkpoint-durability.result }}" != "success" ]; then
            echo "Windows checkpoint durability finished with result: ${{ needs.windows-checkpoint-durability.result }}"
            exit 1
          fi

          if [ "${{ inputs.release-coverage }}" = true ] && [ "${{ needs.coverage.result }}" != success ]; then exit 1; fi
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: uv sync --locked --extra studio --extra dev
      - name: Download routine shard inventories
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "ci-evidence-routine-*" --dir ci-results/validation
      - name: Require complete disjoint routine execution
        run: uv run --no-sync python -m scripts.ci_evidence validate --directory ci-results/validation --expected-group "$LINUX_GROUP" --expected-group routine-windows-latest-plain --count 8
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      LINUX_GROUP: ${{ inputs.release-coverage && 'routine-ubuntu-latest-cov' || 'routine-ubuntu-latest-plain' }}
  coverage:
    name: Combined Linux release coverage
    needs:
      - tests
    if: inputs.release-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: uv sync --locked --extra studio --extra dev
      - name: Download all Linux coverage shards
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "ci-evidence-routine-ubuntu-latest-cov-*" --dir ci-results/coverage-input
      - name: Verify complete coverage selection
        run: uv run --no-sync python -m scripts.ci_evidence validate --directory ci-results/coverage-input --expected-group routine-ubuntu-latest-cov --count 8 --coverage
      - name: Enforce combined 70 percent coverage
        run: |-
          uv run --no-sync coverage combine --keep ci-results/coverage
          uv run --no-sync coverage report --show-missing --fail-under=70
          uv run --no-sync coverage xml
      - name: Upload combined coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-coverage
          path: coverage.xml
          if-no-files-found: error
          overwrite: true
          retention-days: 14
