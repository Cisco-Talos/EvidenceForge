name: Release Slow Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-slow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  slow-comprehensive:
    name: Slow comprehensive tests (no coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run slow comprehensive tests without coverage
        run: uv run pytest --include-slow -m slow --no-cov --durations=20

  release-required:
    name: Required Release CI
    runs-on: ubuntu-latest
    needs: [slow-comprehensive]
    if: always()

    steps:
      - name: Check release jobs
        run: |
          if [ "${{ needs['slow-comprehensive'].result }}" != "success" ]; then
            echo "Slow comprehensive tests finished with result: ${{ needs['slow-comprehensive'].result }}"
            exit 1
          fi
