name: Release Slow Tests
on:
  workflow_call:
    inputs:
      source-ref:
        type: string
        default: ''
      force-tests:
        type: boolean
        default: false
      legacy-memory-policy:
        description: Recover a historical snapshot that predates the memory harness
        type: boolean
        default: false
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force-tests:
        description: Execute fresh slow checks
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-release-slow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  inputs:
    name: CI input identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.identity.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: uv sync --locked --extra studio --extra dev
      - name: Identify tested inputs
        id: identity
        run: uv run --no-sync python -m scripts.ci_evidence identity
      - name: Verify historical memory policy
        env:
          LEGACY_MEMORY_POLICY: ${{ inputs.legacy-memory-policy || false }}
        run: |
          if [ "$LEGACY_MEMORY_POLICY" = "true" ] && [ -f scripts/check_evaluation_memory.py ]; then
            echo "Current snapshots must run the evaluation memory gate"
            exit 1
          fi
  slow-comprehensive:
    name: Slow comprehensive tests (${{ matrix.shard_number }}/4, no coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: 0
            shard_number: 1
          - shard_index: 1
            shard_number: 2
          - shard_index: 2
            shard_number: 3
          - shard_index: 3
            shard_number: 4
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
          prune-cache: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Resolve verified prior result
        id: evidence
        run: uv run --no-sync python -m scripts.ci_evidence resolve
      - name: Run slow shard
        run: uv run --no-sync pytest -m slow --no-cov --durations=20 --ci-tier slow --ci-shard-count 4 --ci-shard-index "${{ matrix.shard_index }}" --ci-report "ci-results/$CI_CHECK_ID/shard.json" --junitxml "ci-timings/$CI_CHECK_ID.xml"
        if: steps.evidence.outputs.reused != 'true'
      - name: Record verified execution
        run: uv run --no-sync python -m scripts.ci_evidence record
      - name: Upload CI evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.evidence.outputs.artifact }}
          path: ci-results/${{ env.CI_CHECK_ID }}/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload complete slow timings
        if: always() && steps.evidence.outputs.reused != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-timings-${{ env.CI_CHECK_ID }}
          path: ci-timings/*.xml
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
    needs:
      - inputs
    env:
      GH_TOKEN: ${{ github.token }}
      CI_CHECK_ID: slow-ubuntu-latest-${{ matrix.shard_index }}
      CI_CHECK_KIND: slow
      CI_JOB_NAME: Slow comprehensive tests (${{ matrix.shard_number }}/4, no coverage)
      CI_RUNNER: ubuntu-latest
      CI_FORCE_RUN: ${{ inputs.force-tests || false }}
    concurrency:
      group: eforge-${{ needs.inputs.outputs.digest }}-slow-ubuntu-latest-${{ matrix.shard_index }}
      queue: max
  checkpoint-portability:
    name: Python 3.12 to 3.13 checkpoint portability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
          prune-cache: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Resolve verified prior result
        id: evidence
        run: uv run --no-sync python -m scripts.ci_evidence resolve
      - name: Verify Python 3.12 to 3.13 checkpoint portability
        run: uv run python scripts/check_checkpoint_python_portability.py
        if: steps.evidence.outputs.reused != 'true'
      - name: Record verified execution
        run: uv run --no-sync python -m scripts.ci_evidence record
      - name: Upload CI evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.evidence.outputs.artifact }}
          path: ci-results/${{ env.CI_CHECK_ID }}/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
    needs:
      - inputs
    env:
      GH_TOKEN: ${{ github.token }}
      CI_CHECK_ID: portability-ubuntu-latest
      CI_CHECK_KIND: portability
      CI_JOB_NAME: Python 3.12 to 3.13 checkpoint portability
      CI_RUNNER: ubuntu-latest
      CI_FORCE_RUN: ${{ inputs.force-tests || false }}
    concurrency:
      group: eforge-${{ needs.inputs.outputs.digest }}-portability-ubuntu-latest
      queue: max
  evaluation-memory:
    needs: inputs
    if: inputs.legacy-memory-policy != true
    uses: ./.github/workflows/evaluation-memory.yml
    with:
      source-ref: ${{ inputs.source-ref || github.sha }}
  release-required:
    name: Required Release CI
    runs-on: ubuntu-latest
    needs:
      - slow-comprehensive
      - checkpoint-portability
      - evaluation-memory
    if: always()
    steps:
      - name: Check release jobs
        env:
          LEGACY_MEMORY_POLICY: ${{ inputs.legacy-memory-policy || false }}
        run: |
          if [ "${{ needs['evaluation-memory'].result }}" != "success" ]; then
            if [ "$LEGACY_MEMORY_POLICY" != "true" ] || [ "${{ needs['evaluation-memory'].result }}" != "skipped" ]; then
              echo "Evaluation memory checks finished with result: ${{ needs['evaluation-memory'].result }}"
              exit 1
            fi
          fi

          if [ "${{ needs['slow-comprehensive'].result }}" != "success" ]; then
            echo "Slow comprehensive tests finished with result: ${{ needs['slow-comprehensive'].result }}"
            exit 1
          fi

          if [ "${{ needs['checkpoint-portability'].result }}" != "success" ]; then
            echo "Checkpoint portability finished with result: ${{ needs['checkpoint-portability'].result }}"
            exit 1
          fi
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: uv sync --locked --extra studio --extra dev
      - name: Download slow shard inventories
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "ci-evidence-slow-*" --dir ci-results/slow-validation
      - name: Require complete disjoint slow execution
        run: uv run --no-sync python -m scripts.ci_evidence validate --directory ci-results/slow-validation --expected-group slow-ubuntu-latest --count 4
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
