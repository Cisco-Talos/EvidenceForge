name: Installer Builds
on:
  workflow_call:
    inputs:
      source-ref:
        type: string
        default: ''
      platform:
        type: string
        default: all
      release:
        type: boolean
        default: false
      force-tests:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      platform:
        description: Native installer to build for testing (never publishes)
        type: choice
        options:
          - all
          - macos-aarch64
          - linux-aarch64
          - linux-x86_64
          - windows-x86_64
        default: linux-x86_64
      force-tests:
        type: boolean
        default: false
        description: Execute fresh native source checks
  push:
    branches:
      - dev
    paths:
      - .github/workflows/installers.yml
      - scripts/package_studio_*.py
      - scripts/verify_studio_*.py
      - scripts/release_pipeline.py
      - desktop-ui/packaging/**
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      digest: ${{ steps.identity.outputs.digest }}
      linux: ${{ steps.matrix.outputs.linux }}
      has-linux: ${{ steps.matrix.outputs.has_linux }}
      has-posix: ${{ steps.matrix.outputs.has_posix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: uv sync --locked --extra studio --extra dev
      - name: Identify tested inputs
        id: identity
        run: uv run --no-sync python -m scripts.ci_evidence identity
      - name: Select native builders
        id: matrix
        env:
          SELECTED_PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          targets = [
              {"platform": "macos-aarch64", "runner": "macos-26", "os": "macos", "architecture": "aarch64", "host_arch": "arm64", "target": "aarch64-apple-darwin"},
              {"platform": "linux-aarch64", "runner": "ubuntu-24.04-arm", "os": "linux", "architecture": "aarch64", "host_arch": "aarch64", "target": "aarch64-unknown-linux-gnu"},
              {"platform": "linux-x86_64", "runner": "ubuntu-24.04", "os": "linux", "architecture": "x86_64", "host_arch": "x86_64", "target": "x86_64-unknown-linux-gnu"},
          ]
          selected = os.environ["SELECTED_PLATFORM"]
          matrix = [target for target in targets if selected in ("all", target["platform"])]
          if not matrix and selected != "windows-x86_64":
              raise SystemExit("Unknown installer platform")
          has_posix = bool(matrix)
          matrix = matrix or [targets[0]]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("has_posix=" + str(has_posix).lower(), file=output)
              print("matrix=" + json.dumps({"include": matrix}), file=output)
              linux = [row for row in matrix if row["os"] == "linux"]
              print("linux=" + json.dumps({"include": linux or [targets[1]]}), file=output)
              print("has_linux=" + str(bool(linux)).lower(), file=output)
          PY
  build:
    name: Installer (${{ matrix.platform }})
    needs:
      - plan
      - native-recovery
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      INSTALLER_PLATFORM: ${{ matrix.platform }}
      INSTALLER_DIRECTORY: dist/${{ matrix.os }}
      BUILD_RELEASE: ${{ inputs.release && 'true' || 'false' }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/studio-${{ matrix.os }}/target
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Checkout exact source snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          fetch-depth: 0
      - name: Require native builder architecture
        env:
          EXPECTED_HOST_ARCH: ${{ matrix.host_arch }}
        run: test "$(uname -m)" = "$EXPECTED_HOST_ARCH"
      - name: Install Linux build and verification dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-tools libfuse2t64
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json
      - name: Install locked dependencies and native Rust target
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          uv sync --frozen --extra studio --extra dev
          npm --prefix desktop-ui ci
          rustup toolchain install stable --profile minimal
          rustup target add "$RUST_TARGET" --toolchain stable
          uv run --no-sync python scripts/sync_studio_version.py --check
      - name: Resolve prior Studio source tests
        id: studio-evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CHECK_ID: studio-${{ matrix.runner }}
          CI_CHECK_KIND: studio
          CI_JOB_NAME: Installer (${{ matrix.platform }})
          CI_RUNNER: ${{ matrix.runner }}
          CI_FORCE_RUN: ${{ inputs.force-tests || false }}
        run: uv run --no-sync python -m scripts.ci_evidence resolve
      - name: Test native shell contracts
        working-directory: desktop-ui/src-tauri
        run: cargo +stable test --locked
        if: steps.studio-evidence.outputs.reused != 'true'
      - name: Build standalone installer
        env:
          INSTALLER_OS: ${{ matrix.os }}
          INSTALLER_ARCH: ${{ matrix.architecture }}
        run: |
          release_flags=()
          if [ "$BUILD_RELEASE" = true ]; then release_flags=(--release); fi
          if [ "$INSTALLER_OS" = macos ]; then
            uv run --no-sync python scripts/package_studio_macos.py --build-app "${release_flags[@]}"
          else
            uv run --no-sync python scripts/package_studio_linux.py --architecture "$INSTALLER_ARCH" "${release_flags[@]}"
          fi
      - name: Verify actual macOS app and disk image
        if: runner.os == 'macOS'
        run: |
          uv run --no-sync python scripts/verify_studio_macos.py \
            "build/studio-macos/target/aarch64-apple-darwin/release/bundle/macos/EvidenceForge Studio.app"
          hdiutil verify dist/macos/*.dmg
      - name: Verify actual AppImage runtime, resources and GStreamer
        if: runner.os == 'Linux'
        run: uv run --no-sync python scripts/verify_studio_linux.py dist/linux/*.AppImage
      - name: Verify exact installer and checksum set
        run: |
          preview_flags=()
          if [ "$BUILD_RELEASE" != true ]; then preview_flags=(--preview); fi
          uv run --no-sync python -m scripts.release_pipeline verify-installer \
            --platform "$INSTALLER_PLATFORM" --directory "$INSTALLER_DIRECTORY" "${preview_flags[@]}"
      - name: Upload verified installer and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.release && 'release' || 'preview' }}-installer-${{ matrix.platform }}
          path: dist/${{ matrix.os }}/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.has-posix == 'true' && (needs.native-recovery.result == 'success' || needs.native-recovery.result == 'skipped')
  native-recovery:
    name: Installer source recovery (${{ matrix.platform }})
    needs:
      - plan
    if: needs.plan.outputs.has-linux == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.linux) }}
    uses: ./.github/workflows/ci-recovery.yml
    with:
      runner: ${{ matrix.runner }}
      source-ref: ${{ inputs.source-ref || github.sha }}
      force-tests: ${{ inputs.force-tests || false }}

  windows-preview:
    name: Installer (windows-x86_64 preview)
    if: ${{ !inputs.release && (inputs.platform == 'windows-x86_64' || inputs.platform == 'all' || inputs.platform == '') }}
    uses: ./.github/workflows/windows-preview.yml
    with:
      source-ref: ${{ inputs.source-ref || github.sha }}
