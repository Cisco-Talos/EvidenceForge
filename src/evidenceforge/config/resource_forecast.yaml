version: 5
calibration_label: "Measured bounded-registry and cross-platform emitter working-set model"

memory:
  base_mib: 90
  emitter_queue_mib_per_format: 0.5
  baseline_bytes_per_occurrence: 700
  explicit_bytes_per_occurrence: 3800
  baseline_occurrence_retention_cap: 20000
  explicit_occurrence_retention_cap: 50000
  fixed_mib_by_format:
    windows_event_security: 20
  baseline_bytes_per_occurrence_by_format:
    windows_event_sysmon: 300
    windows_event_security: 350
  smb_catalog_bytes_per_file: 900
  smb_retained_bytes_per_mutation: 700
  external_sort_mib_per_zeek_format: 0.0
  smb_bytes_per_operation_by_format:
    windows_event_security: 22500
    ecar: 4500
    syslog: 1200
  lower_multiplier: 0.73
  # The 31-day mixed Linux/Samba full-format holdout peaks at 1.87x the
  # bounded-state point estimate because Python allocator high-water memory
  # grows across long emitter runs. A 2.10x ceiling retains 12% measured
  # headroom without making the expected value duration-dependent.
  upper_multiplier: 2.10

# Fresh-process registry costs. Memory/load/lookup use the stable 250K isolated
# points from scripts/foundation_scale_workload.py. The report classifies all 12
# mixed retained-state families: these five receive scenario-derived registry
# projections. Process/timing runtime remain explicitly assigned to the
# calibrated whole-generator peak and bind to their exact mixed-family release
# cases; HTTP/proxy/SMB/RDP/SSH bind to exact sidecar cases while remaining in
# that legacy peak. Those documented exclusions stay provisional until
# scenario-driver coefficients replace them. Mutable operation costs use
# conservative maxima from the prior deterministic smoke probes. Deployment
# content is also provisional because its packed 1M/2M path workload is separate
# from the mixed calibration.
