version: 5
calibration_label: "Historical bounded-registry and cross-platform emitter working-set calibration"

memory:
  base_mib: 90
  emitter_queue_mib_per_format: 0.5
  baseline_bytes_per_occurrence: 700
  explicit_bytes_per_occurrence: 3800
  baseline_occurrence_retention_cap: 20000
  explicit_occurrence_retention_cap: 50000
  fixed_mib_by_format:
    windows_event_security: 20
  baseline_bytes_per_occurrence_by_format:
    windows_event_sysmon: 300
    windows_event_security: 350
  smb_catalog_bytes_per_file: 900
  smb_retained_bytes_per_mutation: 700
  external_sort_mib_per_zeek_format: 0.0
  smb_bytes_per_operation_by_format:
    windows_event_security: 22500
    ecar: 4500
    syslog: 1200
  lower_multiplier: 0.73
  # The 31-day mixed Linux/Samba full-format holdout peaks at 1.87x the
  # bounded-state point estimate because Python allocator high-water memory
  # grows across long emitter runs. A 2.10x ceiling retains 12% measured
  # headroom without making the expected value duration-dependent.
  upper_multiplier: 2.10

# Historical fresh-process registry costs. Memory/load/lookup retain the stable
# 250K isolated measurements without making their former workload an acceptance
# requirement. The report classifies all 12 retained-state families: these five
# receive scenario-derived registry projections. Process/timing runtime and the
# HTTP/proxy/SMB/RDP/SSH sidecars remain explicitly assigned to the calibrated
# whole-generator peak with historical provenance. Those documented exclusions
# stay provisional until scenario-driver coefficients replace them. Mutable
# operation costs retain conservative historical smoke measurements. Deployment
# content is also provisional because its historical packed 1M/2M path
# measurement is separate from the registry calibration.
registries:
  lifecycle:
    measurement:
      status: provisional
      profile: historical_250k_lifecycle_calibration
      operation_profile: historical_smoke_calibration
      measured_entries: 250000
      resident_bytes_per_entry: 773.849088
      structural_bytes_per_entry: 217.762896
      load_microseconds_per_entry: 27.718
      mutation_microseconds_per_entry: 42.52
      lookup_p95_microseconds: 9.041
      expiry_microseconds_per_entry: 14.70
      resident_upper_multiplier: 1.25
      maximum_lookup_candidates: 2
      heap_segment_amplification: 1.0
      compaction_budget_entries: 4096
    projection:
      created_per_effect: 0.30
      mutations_per_created: 2.0
      lookups_per_created: 3.0
      live_horizon_seconds: 7200
      retention_horizon_seconds: 172800
      lease_fraction: 0.10
      lease_bytes_per_entry: 64
      stale_fraction_before_compaction: 0.02
  application_channels:
