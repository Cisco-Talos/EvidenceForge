environment:
  description: "MetroLink Specialty Care operates cardiology, imaging, and rehabilitation offices across a regional metro area."
  timezone: {default: America/New_York}
  domain: metrolinkcare.lab
  users:
    - {username: ana.ross, full_name: "Ana Ross", email: ana.ross@metrolinkcare.lab, persona: healthcare:clinical_coordinator, primary_system: MLSC-CARD-01, groups: [clinical]}
    - {username: devon.price, full_name: "Devon Price", email: devon.price@metrolinkcare.lab, persona: healthcare:clinical_coordinator, primary_system: MLSC-IMG-01, groups: [clinical]}
    - {username: priya.shah, full_name: "Priya Shah", email: priya.shah@metrolinkcare.lab, persona: healthcare:clinical_coordinator, primary_system: MLSC-REHAB-01, groups: [clinical]}
    - {username: marco.lee, full_name: "Marco Lee", email: marco.lee@metrolinkcare.lab, persona: healthcare:clinical_coordinator, primary_system: MLSC-BILL-01, groups: [billing]}
    - {username: taylor.ng, full_name: "Taylor Ng", email: taylor.ng@metrolinkcare.lab, persona: healthcare:clinical_coordinator, primary_system: MLSC-ADMIN-01, groups: [administration]}
    - {username: sam.irwin, full_name: "Sam Irwin", email: sam.irwin@metrolinkcare.lab, persona: healthcare:clinical_coordinator, primary_system: MLSC-IT-01, groups: [it-operations]}
  systems:
    - {hostname: MLSC-CARD-01, ip: 10.61.10.21, os: Windows 11, type: workstation, assigned_user: ana.ross, roles: [workstation]}
    - {hostname: MLSC-IMG-01, ip: 10.61.20.21, os: Windows 11, type: workstation, assigned_user: devon.price, roles: [workstation]}
    - {hostname: MLSC-REHAB-01, ip: 10.61.30.21, os: Windows 11, type: workstation, assigned_user: priya.shah, roles: [workstation]}
    - {hostname: MLSC-BILL-01, ip: 10.61.40.21, os: Windows 11, type: workstation, assigned_user: marco.lee, roles: [workstation]}
    - {hostname: MLSC-ADMIN-01, ip: 10.61.40.22, os: Windows 11, type: workstation, assigned_user: taylor.ng, roles: [workstation]}
    - {hostname: MLSC-IT-01, ip: 10.61.50.21, os: Windows 11, type: workstation, assigned_user: sam.irwin, roles: [workstation]}
    - {hostname: MLSC-DC-01, ip: 10.61.60.10, os: Windows Server 2022, type: domain_controller, services: [DNS, Kerberos, LDAP], roles: [domain_controller, dns_server]}
    - {hostname: MLSC-FILE-01, ip: 10.61.60.20, os: Windows Server 2022, type: server, services: [SMB], roles: [file_server]}
    - {hostname: MLSC-MAIL-01, ip: 10.61.60.30, os: Linux Ubuntu 24.04, type: server, services: [Postfix, Dovecot], roles: [mail_server]}
  groups:
    - {name: clinical, members: [ana.ross, devon.price, priya.shah]}
    - {name: billing, members: [marco.lee]}
    - {name: administration, members: [taylor.ng]}
    - {name: it-operations, members: [sam.irwin]}
  network:
    segments:
      - {name: offices, cidr: 10.61.0.0/16, description: "Regional office workstations", exposure: internal}
      - {name: services, cidr: 10.61.60.0/24, description: "Central services", exposure: internal}
    sensors:
      - {type: network, name: metrolink-core-span, monitoring_segments: [offices, services], direction: bidirectional, placement: span, log_formats: [zeek]}
      - {type: firewall, name: metrolink-edge-fw, monitoring_segments: [offices, services], direction: bidirectional, placement: tap, log_formats: [cisco_asa]}
  email:
    accepted_domains: [metrolinkcare.lab]
    mail_servers: [{name: primary, hostname: mail.metrolinkcare.lab, system: MLSC-MAIL-01, platform: generic_smtp}]
    default_mailbox_servers: [primary]
    outbound_routes: [{name: default, servers: [primary]}]
    inbound_route: [primary]
    background_messages_per_user_per_day: 2.0
  storage:
    population: medium
    activity: normal
    servers:
      - system: MLSC-FILE-01
        audit: standard
        default_volume: data
        volumes:
          - id: data
            mount: 'D:\'
            filesystem: ntfs
            label: MetroLinkCareData
        shares:
          - id: care_operations
            name: CareOperations
            volume: data
            root: Departments\CareOperations
            preset: healthcare:clinical-department
            population: medium
            activity: normal
            seed_files:
              - ref: referral-status
                path: Care Coordination\Referral Status.pdf
                size_bytes: 184320
                tags: [referral, care-coordination]
            access:
              read: [clinical, billing, administration, it-operations]
              modify: [clinical, billing, administration]
              admin: [it-operations]
              deny: []
    mappings:
      - id: care_operations_drive
        share: MLSC-FILE-01.care_operations
        audience:
          groups: [clinical, billing, administration]
        drive: "H:"
        credential_mode: per_user
        lifecycle: persistent
