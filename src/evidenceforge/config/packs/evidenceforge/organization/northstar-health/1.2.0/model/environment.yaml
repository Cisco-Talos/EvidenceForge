environment:
  description: "Northstar Health, a fictional regional care provider."
  timezone:
    default: America/Chicago
  domain: northstarhealth.lab
  users:
    - username: maya.patel
      full_name: "Maya Patel"
      email: maya.patel@northstarhealth.lab
      persona: evidenceforge/healthcare:clinical_coordinator
      primary_system: NSH-CLIN-01
      groups: [clinical-operations]
    - username: daniel.kim
      full_name: "Daniel Kim"
      email: daniel.kim@northstarhealth.lab
      persona: evidenceforge/northstar-health:northstar_it
      primary_system: NSH-IT-01
      groups: [it-operations]
    - username: jordan.lee
      full_name: "Jordan Lee"
      email: jordan.lee@northstarhealth.lab
      persona: evidenceforge/healthcare:clinical_coordinator
      primary_system: NSH-CLIN-LNX-01
      groups: [clinical-operations]
    - username: sofia.martinez
      full_name: "Sofia Martinez"
      email: sofia.martinez@northstarhealth.lab
      persona: evidenceforge/healthcare:clinical_coordinator
      primary_system: NSH-CLIN-02
      groups: [clinical-operations]
    - username: ethan.brooks
      full_name: "Ethan Brooks"
      email: ethan.brooks@northstarhealth.lab
      persona: evidenceforge/northstar-health:northstar_it
      primary_system: NSH-IT-02
      groups: [it-operations]
    - username: daniel.kim-admin
      full_name: "Daniel Kim (administrator)"
      email: daniel.kim-admin@northstarhealth.lab
      persona: evidenceforge/northstar-health:northstar_it
      primary_system: NSH-ADMIN-01
      groups: [infrastructure-admins]
      browsing_intensity: light
    - username: ethan.brooks-admin
      full_name: "Ethan Brooks (administrator)"
      email: ethan.brooks-admin@northstarhealth.lab
      persona: evidenceforge/northstar-health:northstar_it
      primary_system: NSH-ADMIN-01
      groups: [infrastructure-admins]
      browsing_intensity: light
  systems:
    - hostname: NSH-CLIN-01
      ip: 10.42.10.21
      os: Windows 11
      type: workstation
      assigned_user: maya.patel
      roles: [workstation]
    - hostname: NSH-IT-01
      ip: 10.42.50.31
      os: Windows 11
      type: workstation
      assigned_user: daniel.kim
      roles: [workstation]
    - hostname: NSH-CLIN-LNX-01
      ip: 10.42.10.41
      os: Linux Ubuntu 24.04
      type: workstation
      assigned_user: jordan.lee
      services: [cifs-utils, smbclient]
      roles: [workstation]
    - hostname: NSH-CLIN-02
      ip: 10.42.10.22
      os: Windows 11
      type: workstation
      assigned_user: sofia.martinez
      roles: [workstation]
    - hostname: NSH-IT-02
      ip: 10.42.50.32
      os: Windows 11
      type: workstation
      assigned_user: ethan.brooks
      roles: [workstation]
    - hostname: NSH-ADMIN-01
      ip: 10.42.60.21
      os: Windows 11
      type: workstation
      roles: [workstation]
    - hostname: NSH-DC-01
      ip: 10.42.30.10
      os: Windows Server 2022
      type: domain_controller
      services: [DNS, Kerberos, LDAP, WinRM]
      roles: [domain_controller, dns_server]
    - hostname: NSH-FILE-01
      ip: 10.42.20.20
      os: Windows Server 2022
      type: server
      services: [SMB, WinRM]
      roles: [file_server]
    - hostname: NSH-MAIL-01
      ip: 10.42.40.30
      os: Linux Ubuntu 24.04
      type: server
      services: [Postfix, Dovecot, SSH]
      roles: [mail_server]
    - hostname: NSH-SAMBA-01
      ip: 10.42.20.40
      os: Linux Ubuntu 24.04
      type: server
      services: [samba, smbd, SSH]
      roles: [smb_server]
    - hostname: NSH-RELAY-01
      ip: 10.42.70.25
      os: Linux Ubuntu 24.04
      type: server
      services: [Postfix, SSH]
      roles: [mail_server]
      public_hostnames: [mx.northstarhealth.lab]
  groups:
    - name: clinical-operations
      members: [maya.patel, jordan.lee, sofia.martinez]
    - name: it-operations
      members: [daniel.kim, ethan.brooks]
    - name: infrastructure-admins
      description: "Separate administrative accounts for use from the management workstation."
      members: [daniel.kim-admin, ethan.brooks-admin]
  network:
    segments:
      - name: clinical_lan
        cidr: 10.42.10.0/24
        description: "Managed Windows and Linux clinical workstations"
        exposure: internal
        systems: [NSH-CLIN-01, NSH-CLIN-LNX-01, NSH-CLIN-02]
      - name: storage_lan
        cidr: 10.42.20.0/24
        description: "Clinical SMB file and archive servers"
        exposure: internal
        systems: [NSH-FILE-01, NSH-SAMBA-01]
      - name: identity_lan
        cidr: 10.42.30.0/24
        description: "Active Directory and internal DNS"
        exposure: internal
        systems: [NSH-DC-01]
      - name: mail_lan
        cidr: 10.42.40.0/24
        description: "Internal mailbox service"
        exposure: internal
        systems: [NSH-MAIL-01]
      - name: it_lan
        cidr: 10.42.50.0/24
        description: "IT staff daily-use workstations"
        exposure: internal
        systems: [NSH-IT-01, NSH-IT-02]
      - name: management_lan
        cidr: 10.42.60.0/24
        description: "Dedicated workstation for privileged administration"
        exposure: internal
        systems: [NSH-ADMIN-01]
      - name: mail_dmz
        cidr: 10.42.70.0/24
        description: "Internet-facing SMTP relay behind static NAT"
        exposure: external
        systems: [NSH-RELAY-01]
    public_cidrs: ["203.0.113.40/29"]
    routing:
      devices:
        NSH-EDGE-01:
          kind: firewall
          firewall: northstar-edge-fw
      links:
        internet:
          internet: true
          interfaces:
            NSH-EDGE-01: {name: outside, ip: 203.0.113.42}
        clinical_lan:
          segment: clinical_lan
          interfaces:
            NSH-EDGE-01: {name: clinical, ip: 10.42.10.1}
        storage_lan:
          segment: storage_lan
          interfaces:
            NSH-EDGE-01: {name: storage, ip: 10.42.20.1}
        identity_lan:
          segment: identity_lan
          interfaces:
            NSH-EDGE-01: {name: identity, ip: 10.42.30.1}
        mail_lan:
          segment: mail_lan
          interfaces:
            NSH-EDGE-01: {name: mail, ip: 10.42.40.1}
        it_lan:
          segment: it_lan
          interfaces:
            NSH-EDGE-01: {name: it, ip: 10.42.50.1}
        management_lan:
          segment: management_lan
          interfaces:
            NSH-EDGE-01: {name: management, ip: 10.42.60.1}
        mail_dmz:
          segment: mail_dmz
          interfaces:
            NSH-EDGE-01: {name: dmz, ip: 10.42.70.1}
      gateways:
        clinical_lan: NSH-EDGE-01
        storage_lan: NSH-EDGE-01
        identity_lan: NSH-EDGE-01
        mail_lan: NSH-EDGE-01
        it_lan: NSH-EDGE-01
        management_lan: NSH-EDGE-01
        mail_dmz: NSH-EDGE-01
      routes:
        NSH-EDGE-01:
          - {destination: 0.0.0.0/0, internet_link: internet}
    sensors:
      - type: network
        name: northstar-core-span
        monitoring_segments: [clinical_lan, storage_lan, identity_lan, mail_lan, it_lan, management_lan, mail_dmz]
        direction: bidirectional
        placement: span
        log_formats: [zeek]
      - type: firewall
        name: northstar-edge-fw
        hostname: NSH-EDGE-01
        description: "Stateful firewall for inter-zone traffic and the Internet edge."
        monitoring_segments: [clinical_lan, storage_lan, identity_lan, mail_lan, it_lan, management_lan, mail_dmz]
        direction: bidirectional
        placement: tap
        log_formats: [cisco_asa]
        interfaces:
          clinical_lan: clinical
          storage_lan: storage
          identity_lan: identity
          mail_lan: mail
          it_lan: it
          management_lan: management
          mail_dmz: dmz
        interface_security_levels: {management: 100, identity: 95, storage: 85, mail: 80, clinical: 70, it: 60, dmz: 40, outside: 0}
        policy:
          # DNS, time, and directory services are scoped to the domain controller.
          - {src: clinical_lan, dst: 10.42.30.10, ports: [53, 88, 123, 389, 445, 464, 636, 3268, 3269]}
          - {src: it_lan, dst: 10.42.30.10, ports: [53, 88, 123, 389, 445, 464, 636, 3268, 3269]}
          - {src: 10.42.60.21, dst: 10.42.30.10, ports: [53, 88, 123, 389, 445, 464, 636, 3268, 3269, 5986]}
          - {src: storage_lan, dst: 10.42.30.10, ports: [53, 88, 123, 389, 445, 464, 636, 3268, 3269]}
          - {src: 10.42.40.30, dst: 10.42.30.10, ports: [53, 123]}
          # Clinical file access and staff mail.
          - {src: clinical_lan, dst: 10.42.20.20, ports: [445]}
          - {src: clinical_lan, dst: 10.42.20.40, ports: [445]}
          - {src: clinical_lan, dst: 10.42.40.30, ports: [587, 993]}
          - {src: it_lan, dst: 10.42.40.30, ports: [587, 993]}
          # Administration is scoped to the dedicated management workstation.
          - {src: 10.42.60.21, dst: 10.42.20.20, ports: [445, 5986]}
          - {src: 10.42.60.21, dst: 10.42.20.40, ports: [22, 445]}
          - {src: 10.42.60.21, dst: 10.42.40.30, ports: [22]}
          - {src: 10.42.60.21, dst: 10.42.70.25, ports: [22]}
          # Only the relay exchanges SMTP with the internet.
          - {src: external, dst: 10.42.70.25, ports: [25]}
          - {src: 10.42.70.25, dst: external, ports: [25]}
          - {src: 10.42.70.25, dst: 10.42.40.30, ports: [25]}
          - {src: 10.42.40.30, dst: 10.42.70.25, ports: [25]}
          - {src: clinical_lan, dst: external, ports: [443]}
          - {src: it_lan, dst: external, ports: [443]}
        default_action: deny
        deny_ratio: 0
        nat_rules:
          - {type: static, src: [mail_dmz], real_ip: 10.42.70.25, mapped_ip: 203.0.113.43}
          - {type: dynamic_pat, src: [clinical_lan], mapped_ip: 203.0.113.42, interface_pair: [clinical, outside]}
          - {type: dynamic_pat, src: [it_lan], mapped_ip: 203.0.113.42, interface_pair: [it, outside]}
  network_identities:
    - id: public_mail_relay
      hosts: [mx.northstarhealth.lab]
      ips: [203.0.113.43]
      tags: [mail]
  email:
    accepted_domains: [northstarhealth.lab]
    mail_servers:
      - name: primary
        hostname: mail.northstarhealth.lab
        system: NSH-MAIL-01
        platform: generic_smtp
        allow_inbound_starttls: true
        attempt_outbound_starttls: true
      - name: relay
        hostname: mx.northstarhealth.lab
        system: NSH-RELAY-01
        platform: generic_smtp
        allow_inbound_starttls: true
        attempt_outbound_starttls: true
    default_mailbox_servers: [primary]
    outbound_routes:
      - name: default
        servers: [relay]
    inbound_route: [relay, primary]
    background_messages_per_user_per_day: 2.0
  storage:
    population: small
    activity: normal
    servers:
      - system: NSH-FILE-01
        audit: standard
        volumes:
          - id: data
            mount: 'D:\'
            filesystem: ntfs
            label: ClinicalData
        default_volume: data
        shares:
          - id: clinical_ops
            name: ClinicalOps
            volume: data
            root: Departments\ClinicalOperations
            preset: evidenceforge/healthcare:clinical-department
            population: small
            activity: normal
            access:
              read: [clinical-operations, infrastructure-admins]
              modify: [clinical-operations]
              admin: [infrastructure-admins]
              deny: []
      - system: NSH-SAMBA-01
        audit: high
        volumes:
          - id: archive
            mount: /srv/samba
            filesystem: ext4
            label: ClinicalArchive
        default_volume: archive
        shares:
          - id: clinical_archive
            name: ClinicalArchive
            volume: archive
            root: Departments\ClinicalArchive
            preset: evidenceforge/healthcare:clinical-department
            population: small
            activity: normal
            smb_native_filesystem: NTFS
            access:
              read: [clinical-operations, infrastructure-admins]
              modify: [clinical-operations]
              admin: [infrastructure-admins]
              deny: []
    mappings:
      - id: clinical_ops_drive
        share: NSH-FILE-01.clinical_ops
        audience:
          groups: [clinical-operations]
        drive: "H:"
        mount: /mnt/clinical-ops
        lifecycle: persistent
      - id: clinical_archive_mapping
        share: NSH-SAMBA-01.clinical_archive
        audience:
          groups: [clinical-operations]
        drive: "I:"
        mount: /mnt/clinical-archive
        lifecycle: persistent
