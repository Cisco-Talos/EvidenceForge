environment:
  description: "Northstar Health, a fictional regional care provider."
  timezone:
    default: America/Chicago
  domain: northstarhealth.lab
  users:
    - username: maya.patel
      full_name: "Maya Patel"
      email: maya.patel@northstarhealth.lab
      persona: evidenceforge/healthcare:clinical_coordinator
      primary_system: NSH-CLIN-01
      groups: [clinical-operations]
    - username: daniel.kim
      full_name: "Daniel Kim"
      email: daniel.kim@northstarhealth.lab
      persona: evidenceforge/northstar-health:northstar_it
      primary_system: NSH-IT-01
      groups: [it-operations]
    - username: jordan.lee
      full_name: "Jordan Lee"
      email: jordan.lee@northstarhealth.lab
      persona: evidenceforge/healthcare:clinical_coordinator
      primary_system: NSH-CLIN-02
      groups: [clinical-operations]
    - username: sofia.martinez
      full_name: "Sofia Martinez"
      email: sofia.martinez@northstarhealth.lab
      persona: evidenceforge/healthcare:clinical_coordinator
      primary_system: NSH-CLIN-03
      groups: [clinical-operations]
    - username: ethan.brooks
      full_name: "Ethan Brooks"
      email: ethan.brooks@northstarhealth.lab
      persona: evidenceforge/northstar-health:northstar_it
      primary_system: NSH-IT-02
      groups: [it-operations]
  systems:
    - hostname: NSH-CLIN-01
      ip: 10.42.10.21
      os: Windows 11
      type: workstation
      assigned_user: maya.patel
      roles: [workstation]
    - hostname: NSH-IT-01
      ip: 10.42.10.31
      os: Windows 11
      type: workstation
      assigned_user: daniel.kim
      roles: [workstation]
    - hostname: NSH-CLIN-02
      ip: 10.42.10.22
      os: Windows 11
      type: workstation
      assigned_user: jordan.lee
      roles: [workstation]
    - hostname: NSH-CLIN-03
      ip: 10.42.10.23
      os: Windows 11
      type: workstation
      assigned_user: sofia.martinez
      roles: [workstation]
    - hostname: NSH-IT-02
      ip: 10.42.10.32
      os: Windows 11
      type: workstation
      assigned_user: ethan.brooks
      roles: [workstation]
    - hostname: NSH-DC-01
      ip: 10.42.20.10
      os: Windows Server 2022
      type: domain_controller
      services: [DNS, Kerberos, LDAP]
      roles: [domain_controller, dns_server]
    - hostname: NSH-FILE-01
      ip: 10.42.20.20
      os: Windows Server 2022
      type: server
      services: [SMB]
      roles: [file_server]
    - hostname: NSH-MAIL-01
      ip: 10.42.20.30
      os: Linux Ubuntu 24.04
      type: server
      services: [Postfix, Dovecot]
      roles: [mail_server]
  groups:
    - name: clinical-operations
      members: [maya.patel, jordan.lee, sofia.martinez]
    - name: it-operations
      members: [daniel.kim, ethan.brooks]
  network:
    segments:
      - name: clinical_lan
        cidr: 10.42.10.0/24
        description: "Clinical and IT workstations"
        exposure: internal
        systems: [NSH-CLIN-01, NSH-IT-01, NSH-CLIN-02, NSH-CLIN-03, NSH-IT-02]
      - name: server_lan
        cidr: 10.42.20.0/24
        description: "Northstar infrastructure servers"
        exposure: internal
        systems: [NSH-DC-01, NSH-FILE-01, NSH-MAIL-01]
    sensors:
      - type: network
        name: northstar-core-span
        monitoring_segments: [clinical_lan, server_lan]
        direction: bidirectional
        placement: span
        log_formats: [zeek]
      - type: firewall
        name: northstar-edge-fw
        monitoring_segments: [clinical_lan, server_lan]
        direction: bidirectional
        placement: tap
        log_formats: [cisco_asa]
  email:
    accepted_domains: [northstarhealth.lab]
    mail_servers:
      - name: primary
        hostname: mail.northstarhealth.lab
        system: NSH-MAIL-01
        platform: generic_smtp
    default_mailbox_servers: [primary]
    outbound_routes:
      - name: default
        servers: [primary]
    inbound_route: [primary]
    background_messages_per_user_per_day: 2.0
  storage:
    population: small
    activity: normal
    servers:
      - system: NSH-FILE-01
        audit: standard
        volumes:
          - id: data
            mount: 'D:\'
            filesystem: ntfs
            label: ClinicalData
        default_volume: data
        shares:
          - id: clinical_ops
            name: ClinicalOps
            volume: data
            root: Departments\ClinicalOperations
            preset: evidenceforge/healthcare:clinical-department
            population: small
            activity: normal
            access:
              read: [clinical-operations, it-operations]
              modify: [clinical-operations]
              admin: [it-operations]
              deny: []
    mappings:
      - id: clinical_ops_drive
        share: NSH-FILE-01.clinical_ops
        audience:
          groups: [clinical-operations]
        drive: "H:"
        lifecycle: persistent
