    staff and 12 functional workload accounts, engineering HQ and manufacturing site
    linked by a private leased line with IPsec. A single HQ Internet edge serves both
    sites. Customer robots and local fleet servers are outside Talus ownership. The
    routed topology defines subnet gateways, the leased-line path, guest firewall
    boundaries, and sensor attachment points.'
