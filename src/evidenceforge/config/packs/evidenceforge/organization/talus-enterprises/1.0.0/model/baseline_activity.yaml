  - name: customer-support-portal
    kind: web
    direction: inbound
    target:
      system: HQ-PORTAL-01
      host: support.talus.lab
      ip: 203.0.113.10
      port: 443
      service: ssl
    audience:
      external_client_classes:
      - human
    participation: 0.7
    per_client_sessions:
    - 2
    - 4
    cadence: business_hours
    request_profile:
      routes:
      - path: /my/tickets
        weight: 4
        methods:
          GET:
            statuses:
              '200': 1
            response_body_bytes:
            - 4000
            - 20000
            content_type: text/html
      - path: /web/content/approved-release.zip
        weight: 1
        methods:
          GET:
            statuses:
              '200': 1
            response_body_bytes:
            - 1000000
            - 5000000
            content_type: application/zip
      - path: /my/tickets/new
        weight: 1
        methods:
          POST:
            statuses:
              '200': 1
            request_body_bytes:
            - 10000
            - 2000000
            request_content_type: application/octet-stream
            response_body_bytes:
            - 1000
            - 4000
