baseline_activity:
  description: Ordinary Talus business, engineering, and production activity. HQ staff generally work 09:00-17:00
    and manufacturing 07:00-16:00 weekdays. Interactive workload follows personas and application cadences; service-worker
    connections are modeled separately. Portal access is customer initiated. No attack storyline. The staff inventory
    is representative, with restrained ambient volume; authored application cadences retain the normal workflow
    pattern. Twelve explicit functional accounts represent automation workloads through the public active-account
    scheduler, rather than adding executable hooks or an engine-internal job plan.
  intensity: low
  variation: medium
  suspicious_noise: low
  traffic_affinities:
  - name: ci-artifact-publication
    kind: connection
    direction: internal
    destination:
      system: HQ-REG-01
      port: 443
      service: ssl
    audience:
      systems:
      - HQ-CI-01
      - HQ-CI-02
    participation: 1
    per_client_sessions:
    - 24
    - 48
    cadence: diffuse
    connection_profile:
      durations:
      - 5
      - 90
      orig_bytes:
      - 200000
      - 3000000
      resp_bytes:
      - 4000
      - 30000
  - name: gpu-model-tracking
    kind: connection
    direction: internal
    destination:
      system: HQ-MLFLOW-01
      port: 443
      service: ssl
    audience:
      systems:
      - HQ-GPU-01
      - HQ-GPU-02
    participation: 1
    per_client_sessions:
    - 120
    - 240
    cadence: diffuse
    connection_profile:
      durations:
      - 5
      - 90
      orig_bytes:
      - 50000
      - 1000000
      resp_bytes:
      - 3000
      - 30000
  - name: simulation-result-upload
    kind: connection
    direction: internal
    destination:
      system: HQ-REG-01
      port: 443
      service: ssl
    audience:
      systems:
      - HQ-SIM-01
    participation: 1
    per_client_sessions:
    - 24
    - 48
    cadence: diffuse
    connection_profile:
      durations:
      - 5
      - 90
      orig_bytes:
      - 50000
      - 1000000
      resp_bytes:
      - 3000
      - 30000
  - name: manufacturing-release-sync
    kind: connection
    direction: internal
    destination:
      system: HQ-REG-01
      port: 443
      service: ssl
    audience:
      systems:
      - MFG-STAGE-01
    participation: 1
    per_client_sessions:
    - 24
    - 48
    cadence: diffuse
    connection_profile:
      durations:
      - 5
      - 90
      orig_bytes:
      - 3000
      - 12000
      resp_bytes:
      - 1000000
      - 20000000
  - name: manufacturing-log-forwarding
    kind: connection
    direction: internal
    destination:
      system: HQ-LOG-01
      port: 6514
      service: ssl
    audience:
      systems:
      - MFG-LOG-01
    participation: 1
    per_client_sessions:
    - 288
    - 576
    cadence: diffuse
    connection_profile:
