  groups:
    - {name: clinical, members: [ana.ross, devon.price, priya.shah, lila.morgan, noah.bennett, grace.chen, omar.hassan, emily.clark, victor.reed, nina.gupta, liam.turner]}
    - {name: billing, members: [marco.lee, chloe.king, mason.hill, zoe.adams, caleb.ward]}
    - {name: administration, members: [taylor.ng, ava.scott, leo.green, mia.baker]}
    - {name: it-operations, members: [sam.irwin, jack.evans, ella.carter, henry.moore, ivy.cooper]}
  network:
    segments:
      - {name: cardiology, cidr: 10.61.10.0/24, description: "Cardiology office workstations", exposure: internal}
      - {name: imaging, cidr: 10.61.20.0/24, description: "Imaging center workstations", exposure: internal}
      - {name: rehabilitation, cidr: 10.61.30.0/24, description: "Rehabilitation and clinical workstations", exposure: internal}
      - {name: business_office, cidr: 10.61.40.0/24, description: "Billing and administration workstations", exposure: internal}
      - {name: it_operations, cidr: 10.61.50.0/24, description: "Everyday IT operations workstations", exposure: internal}
      - {name: identity, cidr: 10.61.60.0/28, description: "Active Directory and internal DNS", exposure: internal}
      - {name: file_services, cidr: 10.61.60.16/29, description: "CareOperations file services", exposure: internal}
      - {name: mail_services, cidr: 10.61.60.24/29, description: "Internal mailbox and outbound mail services", exposure: internal}
      - {name: privileged_management, cidr: 10.61.70.0/24, description: "Dedicated privileged administration workstation", exposure: internal}
      - {name: edge_transit, cidr: 10.61.254.0/30, description: "Point-to-point transit between the core router and Internet firewall", exposure: internal}
    public_cidrs: [203.0.113.58/32]
    routing:
      devices:
        MLSC-CORE-01: {kind: router}
        MLSC-EDGE-01: {kind: firewall, firewall: metrolink-edge-fw}
      links:
        internet:
          internet: true
          interfaces: {MLSC-EDGE-01: {name: outside, ip: 203.0.113.58}}
        edge_transit:
          segment: edge_transit
          interfaces:
            MLSC-CORE-01: {name: edge, ip: 10.61.254.2}
            MLSC-EDGE-01: {name: inside, ip: 10.61.254.1}
        cardiology:
          segment: cardiology
          interfaces: {MLSC-CORE-01: {name: cardiology, ip: 10.61.10.1}}
        imaging:
          segment: imaging
          interfaces: {MLSC-CORE-01: {name: imaging, ip: 10.61.20.1}}
        rehabilitation:
          segment: rehabilitation
          interfaces: {MLSC-CORE-01: {name: rehabilitation, ip: 10.61.30.1}}
        business_office:
          segment: business_office
          interfaces: {MLSC-CORE-01: {name: business_office, ip: 10.61.40.1}}
        it_operations:
          segment: it_operations
          interfaces: {MLSC-CORE-01: {name: it_operations, ip: 10.61.50.1}}
        identity:
          segment: identity
          interfaces: {MLSC-CORE-01: {name: identity, ip: 10.61.60.1}}
        file_services:
          segment: file_services
          interfaces: {MLSC-CORE-01: {name: file_services, ip: 10.61.60.17}}
        mail_services:
          segment: mail_services
          interfaces: {MLSC-CORE-01: {name: mail_services, ip: 10.61.60.25}}
        privileged_management:
          segment: privileged_management
          interfaces: {MLSC-CORE-01: {name: privileged_management, ip: 10.61.70.1}}
      gateways:
        cardiology: MLSC-CORE-01
        imaging: MLSC-CORE-01
        rehabilitation: MLSC-CORE-01
        business_office: MLSC-CORE-01
        it_operations: MLSC-CORE-01
        identity: MLSC-CORE-01
        file_services: MLSC-CORE-01
        mail_services: MLSC-CORE-01
        privileged_management: MLSC-CORE-01
      routes:
        MLSC-CORE-01:
          - {destination: 0.0.0.0/0, next_hop: 10.61.254.1}
        MLSC-EDGE-01:
          - {destination: 10.61.10.0/24, next_hop: 10.61.254.2}
          - {destination: 10.61.20.0/24, next_hop: 10.61.254.2}
          - {destination: 10.61.30.0/24, next_hop: 10.61.254.2}
          - {destination: 10.61.40.0/24, next_hop: 10.61.254.2}
          - {destination: 10.61.50.0/24, next_hop: 10.61.254.2}
          - {destination: 10.61.60.0/28, next_hop: 10.61.254.2}
          - {destination: 10.61.60.16/29, next_hop: 10.61.254.2}
          - {destination: 10.61.60.24/29, next_hop: 10.61.254.2}
          - {destination: 10.61.70.0/24, next_hop: 10.61.254.2}
          - {destination: 0.0.0.0/0, internet_link: internet}
    sensors:
      - type: network
        name: metrolink-core-span
        description: "Bidirectional TAP on the link between MLSC-CORE-01 and MLSC-EDGE-01."
        placement: tap
        link_tap: {link: edge_transit, scope: all}
        log_formats: [zeek]
      - type: firewall
        name: metrolink-edge-fw
        description: "Internet edge firewall between the core transit link and the Internet."
        monitoring_segments: [edge_transit]
        interfaces: {edge_transit: inside}
        placement: tap
        log_formats: [cisco_asa]
        default_action: deny
        policy:
          # The core router forwards traffic between internal VLANs.
          - {src: cardiology, dst: external, ports: [80, 443]}
          - {src: imaging, dst: external, ports: [80, 443]}
          - {src: rehabilitation, dst: external, ports: [80, 443]}
          - {src: business_office, dst: external, ports: [80, 443]}
          - {src: it_operations, dst: external, ports: [80, 443]}
          - {src: 10.61.60.10, dst: external, ports: [53, 123]}
          - {src: 10.61.60.30, dst: external, ports: [25]}
        nat_rules:
          - type: dynamic_pat
            src: [cardiology, imaging, rehabilitation, business_office, it_operations, identity, mail_services]
            mapped_ip: 203.0.113.58
  email:
    accepted_domains: [metrolinkcare.lab]
    mail_servers: [{name: primary, hostname: mail.metrolinkcare.lab, system: MLSC-MAIL-01, platform: generic_smtp, allow_inbound_starttls: true, attempt_outbound_starttls: true}]
    default_mailbox_servers: [primary]
    outbound_routes: [{name: default, servers: [primary]}]
    background_messages_per_user_per_day: 2.0
  storage:
    population: medium
    activity: normal
    servers:
      - system: MLSC-FILE-01
        audit: standard
        default_volume: data
        volumes:
          - id: data
            mount: 'D:\'
            filesystem: ntfs
            label: MetroLinkCareData
        shares:
          - id: care_operations
            name: CareOperations
            volume: data
            root: Departments\CareOperations
            preset: evidenceforge/healthcare:clinical-department
            population: medium
            activity: normal
            seed_files:
              - ref: referral-status
                path: Care Coordination\Referral Status.pdf
                size_bytes: 184320
                tags: [referral, care-coordination]
            access:
              read: [clinical, billing, administration, it-operations]
              modify: [clinical, billing, administration]
              admin: [it-operations]
              deny: []
    mappings:
      - id: care_operations_drive
        share: MLSC-FILE-01.care_operations
        audience:
          groups: [clinical, billing, administration]
        drive: "H:"
        credential_mode: per_user
        lifecycle: persistent
