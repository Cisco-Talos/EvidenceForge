    - {hostname: MLSC-MAIL-01, ip: 10.61.60.30, os: Linux Ubuntu 24.04, type: server, services: [Postfix, Dovecot], roles: [mail_server]}
  groups:
    - {name: clinical, members: [ana.ross, devon.price, priya.shah, lila.morgan, noah.bennett, grace.chen, omar.hassan, emily.clark, victor.reed, nina.gupta, liam.turner]}
    - {name: billing, members: [marco.lee, chloe.king, mason.hill, zoe.adams, caleb.ward]}
    - {name: administration, members: [taylor.ng, ava.scott, leo.green, mia.baker]}
    - {name: it-operations, members: [sam.irwin, jack.evans, ella.carter, henry.moore, ivy.cooper]}
  network:
    segments:
      - {name: offices, cidr: 10.61.0.0/16, description: "Regional office workstations", exposure: internal}
      - {name: services, cidr: 10.61.60.0/24, description: "Central services", exposure: internal}
    sensors:
      - {type: network, name: metrolink-core-span, monitoring_segments: [offices, services], direction: bidirectional, placement: span, log_formats: [zeek]}
      - {type: firewall, name: metrolink-edge-fw, monitoring_segments: [offices, services], direction: bidirectional, placement: tap, log_formats: [cisco_asa]}
  email:
    accepted_domains: [metrolinkcare.lab]
    mail_servers: [{name: primary, hostname: mail.metrolinkcare.lab, system: MLSC-MAIL-01, platform: generic_smtp}]
    default_mailbox_servers: [primary]
    outbound_routes: [{name: default, servers: [primary]}]
    inbound_route: [primary]
    background_messages_per_user_per_day: 2.0
  storage:
    population: medium
    activity: normal
    servers:
      - system: MLSC-FILE-01
        audit: standard
        default_volume: data
        volumes:
          - id: data
            mount: 'D:\'
            filesystem: ntfs
            label: MetroLinkCareData
        shares:
          - id: care_operations
            name: CareOperations
            volume: data
            root: Departments\CareOperations
            preset: evidenceforge/healthcare:clinical-department
            population: medium
            activity: normal
            seed_files:
              - ref: referral-status
                path: Care Coordination\Referral Status.pdf
                size_bytes: 184320
                tags: [referral, care-coordination]
            access:
              read: [clinical, billing, administration, it-operations]
              modify: [clinical, billing, administration]
              admin: [it-operations]
              deny: []
    mappings:
      - id: care_operations_drive
        share: MLSC-FILE-01.care_operations
        audience:
          groups: [clinical, billing, administration]
        drive: "H:"
        credential_mode: per_user
        lifecycle: persistent
