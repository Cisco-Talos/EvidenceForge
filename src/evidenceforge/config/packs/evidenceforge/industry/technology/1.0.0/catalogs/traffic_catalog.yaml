traffic_catalog:
  delivery-pipeline:
    description: "Build and deployment traffic shape."
    data:
      audience: [platform_engineer]
      applications:
        - application: continuous-delivery
          connection: registry
          weight: 20
      outbound: []
      cadence:
        pattern: periodic
        days: [mon, tue, wed, thu, fri]
        windows:
          - start: "08:00"
            end: "20:00"
        interval_minutes: 45
        jitter_minutes: 5
