    - {path: 'Logon\Map-DepartmentDrives.ps1', mime_type: text/plain, minimum_bytes: 512, maximum_bytes: 16384, presence_probability: 1.0}
    - {path: 'Logon\Set-UserEnvironment.ps1', mime_type: text/plain, minimum_bytes: 512, maximum_bytes: 16384, presence_probability: 1.0}
    - {path: 'Logon\Configure-NetworkPrinters.vbs', mime_type: text/plain, minimum_bytes: 512, maximum_bytes: 12288, presence_probability: 0.65}
    - {path: 'Workstations\Refresh-ManagementAgent.ps1', mime_type: text/plain, minimum_bytes: 1024, maximum_bytes: 32768, presence_probability: 0.55}
    - {path: 'Workstations\Configure-TimeService.cmd', mime_type: text/plain, minimum_bytes: 256, maximum_bytes: 8192, presence_probability: 0.55}
    - {path: 'Maintenance\Collect-LogonDiagnostics.ps1', mime_type: text/plain, minimum_bytes: 1024, maximum_bytes: 32768, presence_probability: 0.55}
    - {path: 'Logoff\Clear-TemporaryMappings.bat', mime_type: text/plain, minimum_bytes: 256, maximum_bytes: 4096, presence_probability: 0.60}
