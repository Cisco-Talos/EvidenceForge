# Synthetic model choices; no host inventory or native calibration is used.
# Every file is modeled as one immutable, single-link regular object in one
# host-local volume. Dense allocation is explicit and does not model APFS
# compression, clones, sparse files or separate sealed/data volume layouts.
schema_version: "1.0"
profile: modeled-macos-installed-v1
volume_id: modeled-installed-volume
volume_device: {min: 1, max: 4095}
first_inode: {min: 50000, max: 5000000}
logical_size_bytes: {min: 16384, max: 33554432}
size_median_bytes: 1048576
size_log_sigma: 1.2
installation_age_seconds: {min: 86400, max: 15552000}
build_lead_seconds: {min: 86400, max: 5184000}
allocation_policy: dense-rounded
allocation_unit_bytes: 4096
permissions: 493 # 0755
flags: 0
generation: 0
