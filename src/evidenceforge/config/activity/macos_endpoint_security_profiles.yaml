# Active modeled targets, selected by explicit scenario OS and architecture.
# A retired generation target remains readable through historical wire codecs.
schema_version: "2.0"
profiles:
  - schema_version: "1.0"
    profile: modeled-macos27-arm64-process-v1
    os_major: 27
    architecture: arm64
    collector_arguments: [/usr/bin/eslogger, fork, exec, exit]
    message_version: 11
    event_types: [9, 11, 15]
    action_type: 1
    result_type: 0
    auth_result: 0
    clock_profile: macos27-workspace-entry-v1
    # Paired Terminal/iTerm2 v11 value shapes; app keys stay separately qualified.
    exec_entitlements: absent_or_bounded_object
    # Reviewed v7 boot-parent export; launchd's own assigned ASID is distinct.
    boot_parent_token: default_unattributed_kernel
