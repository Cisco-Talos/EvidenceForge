# SMB file-transfer observations for Zeek files.log.
#
# Zeek's file analysis framework can observe SMB file content transfers when
# the SMB analyzer and file analysis are enabled. This config controls when a
# successful SMB connection gets a files.log companion row and what that row
# looks like.

min_transfer_bytes: 32768
working_set_probability: 0.84
working_set_size: 3
lexical_composition_probability: 0.82

shares: [Shared, Departments, Projects, Public, Operations]
departments: [Finance, HR, Legal, IT, Operations, Sales, Engineering, Clinical, Compliance]
projects: [Phoenix, Orion, Atlas, Northwind, Quarterly, Horizon, Keystone, Relay]
binary_extensions: [zip, msi, bak, dat, cab]
basenames:
  - budget-review
  - vendor-list
  - roadmap
  - staffing-plan
  - incident-notes
  - change-request
  - customer-export
  - runbook
  - inventory
  - meeting-notes
  - client-onboarding
  - expense-export
  - incident-summary
  - maintenance-window
  - monthly-close
  - oncall-roster
  - purchase-order
  - quarterly-report
  - renewal-tracker
  - risk-register
  - server-build
  - project-plan
  - policy-update
  - service-review
  - status-update
  - access-review
  - audit-evidence
  - capacity-forecast
  - contract-renewals
  - control-matrix
  - data-retention
  - deployment-checklist
  - disaster-recovery
  - endpoint-refresh
  - exception-register
  - forecast-model
  - integration-notes
  - license-summary
  - migration-plan
  - network-diagram
  - patch-report
  - patient-interface
  - release-calendar
