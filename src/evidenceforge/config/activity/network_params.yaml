# Globally assigned networks that are implausible as ordinary Internet visitors.
# These US Department of Defense allocations may satisfy ipaddress.is_global,
# but should not appear in the synthetic residential/business client population.
external_client_excluded_cidrs:
  - "6.0.0.0/8"
  - "7.0.0.0/8"
  - "11.0.0.0/8"
  - "21.0.0.0/8"
  - "22.0.0.0/8"
  - "26.0.0.0/8"
  - "28.0.0.0/8"
  - "29.0.0.0/8"
  - "30.0.0.0/8"
  - "33.0.0.0/8"
  - "55.0.0.0/8"
  - "214.0.0.0/8"
  - "215.0.0.0/8"

# Long-lived service identities that plausibly originate SMB from Linux server
# roles. Roles without a profile keep the endpoint FLOW unattributed instead of
# inventing a root-owned smbclient process for every connection.
linux_smb_connection_owners:
  - role: app_server
    key: document_sync
    image: /opt/meridian/bin/document-sync
    command_line: /opt/meridian/bin/document-sync --share smb://{target}/Integration --mode poll
    username: meridian-app
  - role: database
    key: database_backup_agent
    image: /usr/local/sbin/database-backup-agent
    command_line: /usr/local/sbin/database-backup-agent --repository smb://{target}/DatabaseBackups
    username: backup
  - role: mail_server
    key: attachment_archive
    image: /usr/libexec/meridian/attachment-archive
    command_line: /usr/libexec/meridian/attachment-archive --share smb://{target}/MailArchive
    username: dovecot
  - role: web_server
    key: content_publisher
    image: /opt/meridian/bin/content-publisher
    command_line: /opt/meridian/bin/content-publisher --share smb://{target}/WebContent
    username: www-data

