    platforms:
      macos:
        image_path: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        executable_format: mach_o
        # Public vendor templates, confirmed by fixed reference comparisons.
        # Content hashes/UUIDs remain synthetic release-owned identities.
