        available_from: '2026-10-15'
        deployment:
          kind: managed
          product_id: chrome
          version: 155.0.8059.80
          build: 155.0.8059.80
          scope: machine
          architectures:
          - arm64
        command_templates:
        - '"/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --new-window {internal_url}'
        # The native producer adds its canonical sandbox-pipe argument.
        children:
        - '"/Applications/Google Chrome.app/Contents/Frameworks/Google Chrome Framework.framework/Versions/155.0.8059.80/Helpers/Google Chrome Helper (Renderer).app/Contents/MacOS/Google Chrome Helper (Renderer)" --type=renderer'
        - '"/Applications/Google Chrome.app/Contents/Frameworks/Google Chrome Framework.framework/Versions/155.0.8059.80/Helpers/Google Chrome Helper.app/Contents/MacOS/Google Chrome Helper" --type=gpu-process'
        - '"/Applications/Google Chrome.app/Contents/Frameworks/Google Chrome Framework.framework/Versions/155.0.8059.80/Helpers/Google Chrome Helper.app/Contents/MacOS/Google Chrome Helper" --type=utility --utility-sub-type=network.mojom.NetworkService'
