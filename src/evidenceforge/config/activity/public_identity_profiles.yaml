  - id: external_logon
    providers: [external-access]
    identities:
      - {ip: 45.79.19.196, provider: external-access, weight: 2}
      - {ip: 139.162.174.124, provider: external-access, weight: 2}
      - {ip: 91.219.236.174, provider: external-access, weight: 2}
      - {ip: 23.129.64.210, provider: external-access, weight: 1}
