# Important typed facts. Alternatives must express the fact, not merely nearby traffic.
typed_facts:
  dhcp_lease:
    formats: [zeek_dhcp]
    capability: NETWORK
  transport:
    formats: [zeek_conn, ecar, windows_event_sysmon, windows_event_security, cisco_asa]
    capability: NETWORK
  http_result:
    formats: [zeek_http, proxy_access, web_access]
    capability: HTTP
  dns_answer:
    formats: [zeek_dns, windows_event_sysmon]
    capability: DNS
  smtp_result:
    formats: [zeek_smtp]
    capability: NETWORK
  authentication:
    formats: [windows_event_security, ecar, syslog, macos_unified_log]
    capability: AUTHENTICATION
# Required facts use native field names, independent of templates.
native_context_fields:
  windows_event_security:
    account_management:
      TargetUserName: target_username
      TargetSid: target_sid
    group_membership:
      TargetUserName: group_name
      MemberName: member_name
      MemberSid: member_sid
    service:
      ServiceName: service_name
      ServiceFileName: service_file_name
      ServiceAccount: service_account
    scheduled_task:
      TaskName: task_name
  windows_event_sysmon:
    remote_thread:
      TargetProcessId: target_pid
      TargetImage: target_image
      NewThreadId: new_thread_id
    process_access:
      SourceProcessId: source_pid
      TargetProcessId: target_pid
      TargetImage: target_image
      GrantedAccess: granted_access
  ecar:
    remote_thread:
      target_pid: target_pid
      target_image_path: target_image
    process_access:
      target_pid: target_pid
      target_image_path: target_image
      granted_access: granted_access
    service:
      service_name: service_name
      image_path: service_file_name
      service_account: service_account
