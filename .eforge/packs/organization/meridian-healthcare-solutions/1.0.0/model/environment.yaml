      ips: ["10.10.3.20"]
      tags: ["proxy", "infrastructure"]
      dns: true
    - id: mail_edge_public
      hosts: ["mail.meridianhcs.com"]
      ips: ["203.14.220.11"]
      tags: ["email", "smtp"]
      dns: true
  systems:
    - hostname: WS-LNGUYEN-01
      ip: "10.10.1.21"
      os: "Ubuntu 22.04"
      type: workstation
      assigned_user: lina.nguyen
      services: ["ssh", "systemd-resolved"]

    - hostname: WS-OHADDAD-01
      ip: "10.10.1.22"
      os: "Ubuntu 22.04"
      type: workstation
      assigned_user: omar.haddad
      services: ["ssh", "systemd-resolved"]

    - hostname: WS-MCHEN-01
      ip: "10.10.1.31"
      os: "Windows 11 Enterprise"
      type: workstation
      assigned_user: marcus.chen
      services: ["dns-client", "w32time"]

    - hostname: WS-PPATEL-01
      ip: "10.10.1.32"
      os: "Windows 11 Enterprise"
      type: workstation
      assigned_user: priya.patel
      services: ["dns-client", "w32time"]

    - hostname: WS-EBROOKS-01
      ip: "10.10.1.33"
      os: "Windows 10 Enterprise"
      type: workstation
      assigned_user: evelyn.brooks
      services: ["dns-client", "w32time"]

    - hostname: WS-DRAMIREZ-01
      ip: "10.10.1.34"
      os: "Windows 10 Enterprise"
      type: workstation
      assigned_user: diego.ramirez
      services: ["dns-client", "w32time"]

    - hostname: WS-AJOHNSON-01
      ip: "10.10.1.35"
      os: "Windows 10 Enterprise"
      type: workstation
      assigned_user: aisha.johnson
      services: ["dns-client", "w32time", "remote_desktop"]

    - hostname: WS-SMARTINEZ-01
      ip: "10.10.1.36"
      os: "Windows 10 Enterprise"
      type: workstation
      assigned_user: sophia.martinez
      services: ["dns-client", "w32time"]

    - hostname: LT-MRIVERA-02
      ip: "10.10.1.99"
      os: "Ubuntu 22.04"
      type: workstation
      services: ["dhclient", "ssh"]

    - hostname: DC-01
      ip: "10.10.2.10"
      os: "Windows Server 2022"
      type: domain_controller
      services: ["ad-ds", "dns", "kerberos", "ldap", "smb", "w32time", "windows-dhcp-server"]
      roles: ["domain_controller", "dns_server", "dhcp_server"]

    - hostname: FILE-SRV-01
      ip: "10.10.2.20"
      os: "Windows Server 2019"
      type: server
      services: ["smb", "dns-client", "w32time"]
      roles: ["file_server"]

    - hostname: MAIL-EDGE-01
      ip: "10.10.2.25"
      os: "Ubuntu 22.04"
      type: server
      services: ["smtp", "imaps", "postfix", "dovecot", "systemd-resolved"]
      roles: ["mail_server"]

    - hostname: MAIL-CLIN-01
      ip: "10.10.2.26"
      os: "Ubuntu 22.04"
      type: server
      services: ["smtp", "imaps", "postfix", "dovecot", "systemd-resolved"]
      roles: ["mail_server"]

    - hostname: MAIL-FIN-01
      ip: "10.10.2.27"
      os: "Windows Server 2022"
      type: server
      services: ["smtp", "owa", "imaps", "exchange", "dns-client", "w32time"]
      roles: ["mail_server"]

    - hostname: WEB-EXT-01
      ip: "10.10.3.10"
      os: "Ubuntu 22.04"
      type: server
      services: ["apache2", "php-fpm", "ssh", "systemd-resolved"]
      roles: ["web_server"]
      public_hostnames: ["ehr-portal.meridianhcs.com"]

    - hostname: PROXY-01
      ip: "10.10.3.20"
      os: "Ubuntu 22.04"
      type: server
      services: ["squid", "ssh", "systemd-resolved"]
      roles: ["forward_proxy"]
      public_hostnames: ["proxy.meridianhcs.com"]

    - hostname: APP-INT-01
      ip: "10.10.2.30"
      os: "Ubuntu 22.04"
      type: server
      services: ["ssh", "gunicorn", "systemd-resolved"]
      roles: ["app_server"]

    - hostname: DB-PROD-01
      ip: "10.10.4.10"
      os: "CentOS 8"
      type: server
      services: ["mysql", "ssh"]
      roles: ["database"]

  storage:
    population: medium
    activity: normal
    servers:
      - system: FILE-SRV-01
        presets: [collaboration, homes]
        audit: high
        default_volume: data
        volumes:
          - id: data
            mount: 'D:\'
            filesystem: ntfs
            label: SharedData
          - id: archive
            mount: 'C:\Mounts\Archive\'
            filesystem: refs
            label: ClinicalArchive
        shares:
          - id: finance
            name: Finance
            volume: data
            root: 'Departments\Finance'
            preset: department
            population: medium
            activity: high
            encryption: not_required
            access:
              read: [finance]
              modify: [finance]
              admin: [domain-admins]
              deny: [sales]
            seed_files:
              - ref: q1_forecast
                path: 'Q1\FY24\Q1-forecast.xlsx'
                size_bytes: 1843200
                tags: [finance, office, forecast]
              - ref: q1_budget
                path: 'Q1\FY24\Q1-budget.xlsx'
                size_bytes: 937984
                tags: [finance, office, budget]
              - ref: q1_variance
                path: 'Q1\FY24\Q1-variance.xlsx'
                size_bytes: 716800
                tags: [finance, office, variance]
              - ref: q1_board_pack
                path: 'Q1\FY24\Q1-board-pack.pdf'
                size_bytes: 4928307
                tags: [finance, pdf, board]
              - ref: q1_close_notes
                path: 'Q1\FY24\Q1-close-notes.docx'
                size_bytes: 284672
                tags: [finance, office, close]
              - ref: variance_draft
                path: 'Q1\FY24\Drafts\variance-notes.docx'
                size_bytes: 198144
                tags: [finance, office, draft]
          - id: clinical-exports
            name: ClinicalExports
            volume: archive
            root: 'Clinical\Exports'
            preset: backup
            population: small
            activity: low
            encryption: required
            access:
              read: [analytics]
              modify: [analytics]
              admin: [domain-admins]
              deny: []
            seed_files:
              - ref: deidentified_claims
                path: 'Audit\2024-03\deidentified-claims-sample.csv'
                size_bytes: 8650752
                tags: [clinical, export, csv, deidentified]
    mappings:
      - id: finance-f
        share: FILE-SRV-01.finance
        audience:
          groups: [finance]
          systems: [WS-DRAMIREZ-01]
        drive: 'F:'
        lifecycle: persistent

  network:
    public_cidrs: ["203.14.220.0/28"]
    segments:
      - name: corporate_lan
        cidr: "10.10.1.0/24"
        description: "Corporate workstation network"
        systems:
          - WS-LNGUYEN-01
          - WS-OHADDAD-01
          - WS-MCHEN-01
          - WS-PPATEL-01
          - WS-EBROOKS-01
          - WS-DRAMIREZ-01
          - WS-AJOHNSON-01
          - WS-SMARTINEZ-01
          - LT-MRIVERA-02
        exposure: internal
      - name: server_vlan
        cidr: "10.10.2.0/24"
        description: "Internal server VLAN"
        systems: [DC-01, FILE-SRV-01, MAIL-EDGE-01, MAIL-CLIN-01, MAIL-FIN-01, APP-INT-01]
        exposure: internal
      - name: dmz
        cidr: "10.10.3.0/24"
        description: "Internet-facing DMZ"
        systems: [WEB-EXT-01, PROXY-01]
        exposure: both
        external_ratio: 0.6
      - name: database_vlan
        cidr: "10.10.4.0/24"
        description: "Database VLAN without a dedicated sensor"
        systems: [DB-PROD-01]
        exposure: internal
    sensors:
      - type: network
        name: zeek-core
        placement: span
        monitoring_segments: [corporate_lan, server_vlan]
        direction: bidirectional
        log_formats: [zeek]
      - type: network
        name: zeek-dmz
        placement: span
        monitoring_segments: [dmz]
        direction: bidirectional
        log_formats: [zeek]
      - type: ids
        name: snort-perimeter
        placement: tap
        monitoring_segments: [dmz]
        direction: bidirectional
        log_formats: [snort_alert]
      - type: ids
        name: snort-core
        placement: span
        monitoring_segments: [corporate_lan, server_vlan]
        direction: bidirectional
        log_formats: [snort_alert]
      - type: firewall
        name: fw-perimeter
        placement: tap
        monitoring_segments: [corporate_lan, server_vlan, dmz]
        direction: bidirectional
        log_formats: [cisco_asa]
        interfaces:
          corporate_lan: inside
          server_vlan: inside
          dmz: dmz
        default_action: deny
        deny_ratio: 2.0
        drop_mode: drop
        threat_detection_rate: 10
        nat_rules:
          - type: dynamic_pat
            src: [corporate_lan, server_vlan, dmz]
            mapped_ip: "203.14.220.1"
          - type: static
            src: dmz
            real_ip: "10.10.3.10"
            mapped_ip: "203.14.220.10"
          - type: static
            src: server_vlan
            real_ip: "10.10.2.25"
            mapped_ip: "203.14.220.11"
        policy:
          - {src: external, dst: dmz, ports: [80, 443]}
          - {src: external, dst: server_vlan, ports: [25]}
          - {src: corporate_lan, dst: any, ports: []}
          - {src: server_vlan, dst: external, ports: [25, 53, 80, 443]}
          - {src: server_vlan, dst: server_vlan, ports: []}
          - {src: dmz, dst: server_vlan, ports: [3306]}

  proxy:
    mode: explicit
    listener_port: 8080

  email:
    accepted_domains:
      - meridianhcs.com
      - research.meridianhcs.com
    mail_servers:
      - name: edge
        hostname: mail.meridianhcs.com
        system: MAIL-EDGE-01
        platform: generic_smtp
        allow_inbound_starttls: true
        attempt_outbound_starttls: true
      - name: clinical
        hostname: mail-clinical.meridianhcs.com
        system: MAIL-CLIN-01
        platform: generic_smtp
        allow_inbound_starttls: true
        attempt_outbound_starttls: true
      - name: finance
        hostname: mail-fin.meridianhcs.com
        system: MAIL-FIN-01
        platform: exchange
        allow_inbound_starttls: false
        attempt_outbound_starttls: false
    default_mailbox_servers: [edge]
    mailbox_overrides:
      - group: engineering
        server: clinical
      - group: analytics
        server: clinical
      - group: finance
        server: finance
      - group: executives
        server: finance
    outbound_routes:
      - name: default
        servers: [edge]
      - name: clinical-via-edge
        sender_groups: [engineering, analytics]
        servers: [clinical, edge]
        isp_relays:
          - smtp1.greatplains-mail.net
          - smtp2.greatplains-mail.net
      - name: finance-via-edge
        sender_groups: [finance, executives]
        servers: [finance, edge]
    inbound_route: [edge]
    isp_relays:
      - relay1.northlake-messaging.net
      - relay2.northlake-messaging.net
    distribution_groups:
      - address: clinical-ops@meridianhcs.com
        members:
          - lina.nguyen@meridianhcs.com
          - omar.haddad@meridianhcs.com
          - priya.patel@meridianhcs.com
      - address: finance@meridianhcs.com
        members:
          - diego.ramirez@meridianhcs.com
          - evelyn.brooks@meridianhcs.com
      - address: it-help@meridianhcs.com
        members:
          - aisha.johnson@meridianhcs.com
          - marcus.chen@meridianhcs.com
      - address: ehr-release@research.meridianhcs.com
        members:
          - lina.nguyen@meridianhcs.com
          - omar.haddad@meridianhcs.com
    artifacts:
      mode: all
    background_messages_per_user_per_day: 12.0
